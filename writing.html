<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾里楼台 · 集大成者</title>
<meta name="description" content="集大成者的文学创作「雾里楼台」：日记、随感、长文，皆收于此。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f1e3'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23a63d2f' font-family='serif'%3E雾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e3;
    --paper-deep: #efe7d2;
    --ink: #33291f;
    --ink-2: #5c5142;
    --ink-3: #8a7b67;
    --cinnabar: #a63d2f;
    --cinnabar-deep: #8c2f22;
    --teal: #3f5d57;
    --line: rgba(51, 41, 31, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(180, 160, 120, 0.10), transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(120, 140, 120, 0.08), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(120, 105, 80, 0.020) 3px 4px),
      var(--paper);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before { /* 宣纸纤维噪点 */
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(rgba(90, 75, 55, 0.035) 0.6px, transparent 0.8px),
      radial-gradient(rgba(90, 75, 55, 0.028) 0.5px, transparent 0.7px);
    background-size: 37px 43px, 61px 67px;
    pointer-events: none; z-index: 1;
  }
  .ink-drop { /* 飘落花瓣画布 */
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
  }

  /* ---------- 顶部导航 ---------- */
  .topbar {
    position: relative; z-index: 20;
    display: flex; align-items: center; gap: 26px;
    padding: 14px clamp(18px, 4vw, 44px);
    border-bottom: 1px solid var(--line);
    background: rgba(246, 241, 227, 0.82);
    backdrop-filter: blur(6px);
  }
  .brand {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 23px; letter-spacing: 2px; color: var(--cinnabar);
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  }
  .brand .seal-mark {
    width: 9px; height: 9px; background: var(--cinnabar);
    transform: rotate(45deg); flex-shrink: 0;
  }
  .nav { display: flex; list-style: none; gap: 4px; flex-wrap: wrap; }
  .nav a {
    display: block; padding: 6px 12px; color: var(--ink-2);
    text-decoration: none; font-size: 15px; letter-spacing: 1px;
    border-bottom: 2px solid transparent; transition: color .25s, border-color .25s;
  }
  .nav a:hover { color: var(--cinnabar); }
  .nav a[aria-current="page"] { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }
  .topbar-clock {
    margin-left: auto; font-size: 13px; color: var(--ink-3);
    letter-spacing: 1px; white-space: nowrap; font-family: "Ma Shan Zheng", serif; font-size: 15px;
  }

  /* ---------- 主卷轴 ---------- */
  .scroll-wrap {
    position: relative; z-index: 10;
    max-width: 920px; margin: 0 auto;
    padding: 34px 18px 60px;
  }
  .scroll {
    position: relative;
    background: linear-gradient(180deg, #fbf7ea, #f3ecda 60%, #efe6d0);
    border: 1px solid rgba(51, 41, 31, 0.12);
    border-radius: 3px;
    box-shadow: 0 18px 48px rgba(70, 55, 30, 0.14), 0 2px 8px rgba(70, 55, 30, 0.08);
    padding: clamp(26px, 6vw, 64px) clamp(20px, 6vw, 72px) 54px;
  }
  .scroll::before, .scroll::after { /* 卷轴上下木杆 */
    content: ""; position: absolute; left: 0; right: 0; height: 9px;
    background: linear-gradient(180deg, #c9b894, #a18a5f 45%, #7d6844);
    border-radius: 2px;
  }
  .scroll::before { top: -5px; box-shadow: 0 2px 5px rgba(60,45,20,.25); }
  .scroll::after { bottom: -5px; box-shadow: 0 -2px 5px rgba(60,45,20,.22); }

  .scroll-inner { position: relative; }

  /* 角印花纹 */
  .corner { position: absolute; width: 46px; height: 46px; opacity: .5; pointer-events: none; }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 14px; left: 14px; transform: rotate(0); }
  .corner.br { bottom: 14px; right: 14px; transform: rotate(180deg); }

  /* ---------- 题头 ---------- */
  .masthead { text-align: center; margin-bottom: 26px; }
  .masthead .brush {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: clamp(46px, 9vw, 74px);
    line-height: 1.15; color: var(--ink); letter-spacing: 12px;
    text-shadow: 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(90,70,40,.16);
    user-select: none;
  }
  .masthead .sub {
    margin-top: 6px; color: var(--ink-3); font-size: 13px; letter-spacing: 6px;
  }
  .masthead .rule {
    display: flex; align-items: center; gap: 14px;
    margin: 20px auto 0; max-width: 320px;
  }
  .masthead .rule::before, .masthead .rule::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .masthead .rule .dot { width: 6px; height: 6px; background: var(--cinnabar); border-radius: 50%; }

  /* 诗签 */
  .verse-tag {
    max-width: 460px; margin: 22px auto 0;
    padding: 14px 22px 14px 26px;
    position: relative;
    border: 1px solid rgba(166,61,47,.35);
    border-left: 3px solid var(--cinnabar);
    background: rgba(255, 250, 236, 0.6);
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 18px; letter-spacing: 2px; color: var(--ink-2);
    transform: rotate(-0.4deg);
    transition: transform .35s, box-shadow .35s;
    box-shadow: 0 2px 10px rgba(90,60,30,.08);
  }
  .verse-tag:hover { transform: rotate(0deg) translateY(-2px); box-shadow: 0 8px 22px rgba(90,60,30,.14); }
  .verse-tag .qmark {
    position: absolute; left: -9px; top: -10px;
    background: var(--cinnabar); color: #fdf6e6;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-family: serif;
  }

  /* ---------- 写作区 ---------- */
  .section-label {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Ma Shan Zheng", serif; font-size: 22px; letter-spacing: 4px;
    color: var(--ink); margin: 30px 0 14px;
  }
  .section-label::before {
    content: ""; width: 8px; height: 8px; background: var(--cinnabar); transform: rotate(45deg);
  }

  .work-grid {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
    gap: 22px; align-items: start;
  }
  @media (max-width: 760px) { .work-grid { grid-template-columns: 1fr; } }

  .sheet {
    background: #fbf7ea;
    border: 1px solid rgba(51,41,31,.14);
    padding: 22px 22px 18px;
    position: relative;
    box-shadow: inset 0 0 30px rgba(120,100,70,.06);
  }
  .sheet::before {
    content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(180deg, transparent, var(--line) 8%, var(--line) 92%, transparent);
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .sheet-title { font-family: "Ma Shan Zheng", serif; font-size: 20px; letter-spacing: 3px; color: var(--cinnabar-deep); }
  .hint { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--ink-2); letter-spacing: 2px; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 12px;
    font-family: "Noto Serif SC", serif; font-size: 15px;
    color: var(--ink); background: rgba(255,253,246,.7);
    border: 1px solid var(--line); border-radius: 2px;
    outline: none; transition: border-color .25s, box-shadow .25s;
  }
  .field input:focus, .field select:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(166,61,47,.12); }
  .field select { cursor: pointer; }

  .field textarea {
    width: 100%; min-height: 240px; resize: vertical;
    padding: 14px 16px;
    font-family: "Noto Serif SC", serif; font-size: 16px; line-height: 2.1;
    color: var(--ink); background: rgba(255,253,246,.75);
    border: 1px solid var(--line); border-radius: 2px; outline: none;
    background-image:
      linear-gradient(transparent 1.9em, rgba(51,41,31,.055) 2em);
    background-size: 100% 2.1em; /* 稿纸横格 */
    transition: border-color .25s, box-shadow .25s;
  }
  .field textarea:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(166,61,47,.12); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .toolbar-end { display: flex; gap: 10px; }

  /* 墨晕按钮 */
  .btn {
    position: relative; overflow: hidden;
    padding: 8px 22px; cursor: pointer;
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif; font-size: 17px; letter-spacing: 3px;
    color: #fbf5e6; background: var(--ink);
    border: 1px solid var(--ink); border-radius: 2px;
    transition: background .3s, color .3s, box-shadow .3s;
  }
  .btn::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 0; height: 0; border-radius: 50%;
    background: rgba(255, 250, 235, 0.35);
    transform: translate(-50%, -50%);
    transition: width .45s ease-out, height .45s ease-out, opacity .45s;
    opacity: 0; pointer-events: none;
  }
  .btn:hover::after { width: 260px; height: 260px; opacity: 1; }
  .btn:hover { background: var(--cinnabar-deep); border-color: var(--cinnabar-deep); box-shadow: 0 6px 18px rgba(140,47,34,.28); }
  .btn-ghost {
    color: var(--ink-2); background: transparent; border-color: var(--line);
  }
  .btn-ghost:hover { background: rgba(51,41,31,.06); color: var(--ink); border-color: var(--ink-3); box-shadow: none; }
  .btn-ghost::after { display: none; }

  /* ---------- 存档 ---------- */
  .archive { margin-top: 8px; }
  .entry {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px 12px 20px; margin-bottom: 10px;
    background: #faf5e6; border: 1px solid rgba(51,41,31,.10);
    border-left: 3px solid var(--cinnabar);
    position: relative;
    transition: transform .25s, box-shadow .25s, border-color .25s;
  }
  .entry:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(90,60,30,.12); border-color: rgba(51,41,31,.28); }
  .entry-main { min-width: 0; flex: 1; }
  .entry-open {
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: "Ma Shan Zheng", serif; font-size: 19px; letter-spacing: 2px;
    color: var(--ink); text-align: left; line-height: 1.4;
  }
  .entry-open:hover { color: var(--cinnabar); text-decoration: underline; text-underline-offset: 4px; }
  .entry-meta { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; margin-top: 3px; }
  .entry-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .mini-btn {
    font-family: "Noto Serif SC", serif; font-size: 12px; letter-spacing: 1px;
    color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); padding: 4px 10px; cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .mini-btn:hover { color: var(--cinnabar); border-color: var(--cinnabar); background: rgba(166,61,47,.06); }
  .empty { text-align: center; padding: 34px 10px; color: var(--ink-3); }
  .empty strong { display: block; font-family: "Ma Shan Zheng", serif; font-size: 21px; color: var(--ink-2); letter-spacing: 3px; font-weight: 400; }
  .empty p { font-size: 13px; margin-top: 6px; letter-spacing: 1px; }

  /* ---------- 阅读弹层（竖排卷轴） ---------- */
  .reader { position: fixed; inset: 0; z-index: 60; display: none; }
  .reader.show { display: block; }
  .reader .veil {
    position: absolute; inset: 0; background: rgba(30, 24, 14, 0.55);
    backdrop-filter: blur(3px);
    animation: veilIn .3s ease both;
  }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
  .reader .vol {
    position: absolute; left: 50%; top: 50%;
    width: min(560px, 92vw); height: min(600px, 84vh);
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, #f2e8d2, #fbf5e4 12%, #f6eedb 88%, #eee2c8);
    border: 1px solid rgba(60,45,20,.25);
    box-shadow: 0 30px 80px rgba(20,12,4,.5);
    padding: 34px 44px 30px 40px;
    animation: volIn .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes volIn { from { transform: translate(-50%, -46%) scale(.92); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .reader .vol::before, .reader .vol::after {
    content: ""; position: absolute; left: 0; right: 0; height: 8px;
    background: linear-gradient(180deg, #b39a6a, #8f7447 50%, #6e5a35);
    border-radius: 2px;
  }
  .reader .vol::before { top: -4px; }
  .reader .vol::after { bottom: -4px; }
  .reader .vol-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 10px; border-bottom: 1px solid rgba(60,45,20,.18);
    margin-bottom: 12px;
  }
  .reader .vol-title {
    font-family: "Ma Shan Zheng", serif; font-size: 22px; letter-spacing: 3px; color: var(--cinnabar-deep);
  }
  .reader .vol-meta { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; }
  .reader .vol-body {
    height: calc(100% - 56px); overflow: auto;
    writing-mode: vertical-rl; text-orientation: upright;
    font-size: 17px; line-height: 2.05; letter-spacing: 2px;
    color: var(--ink); padding: 6px 2px;
    scrollbar-width: thin; scrollbar-color: rgba(140,47,34,.4) transparent;
  }
  .reader .vol-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .reader .vol-body::-webkit-scrollbar-thumb { background: rgba(140,47,34,.35); border-radius: 3px; }
  .reader .vol-close {
    position: absolute; top: 12px; right: 14px;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(60,45,20,.3); background: rgba(250,245,230,.9);
    color: var(--ink-2); font-size: 16px; cursor: pointer;
    font-family: "Ma Shan Zheng", serif;
    transition: transform .2s, color .2s, border-color .2s;
  }
  .reader .vol-close:hover { transform: rotate(90deg); color: var(--cinnabar); border-color: var(--cinnabar); }

  /* ---------- 盖印 ---------- */
  .seal {
    position: fixed; left: 50%; top: 42%; z-index: 80;
    transform: translate(-50%, -50%) scale(3) rotate(-8deg);
    width: 118px; height: 118px;
    display: none; align-items: center; justify-content: center;
    border: 4px solid var(--cinnabar); color: var(--cinnabar);
    font-family: "Ma Shan Zheng", serif; font-size: 30px; letter-spacing: 4px;
    text-align: center; line-height: 1.25;
    box-shadow: 0 6px 24px rgba(140,47,34,.35);
    pointer-events: none;
    animation: sealStamp .9s cubic-bezier(.2,.9,.35,1.4) both;
  }
  .seal.show { display: flex; }
  @keyframes sealStamp {
    0%   { transform: translate(-50%, -190%) scale(1.6) rotate(-14deg); opacity: 0; }
    45%  { transform: translate(-50%, -50%) scale(.9) rotate(-4deg); opacity: 1; }
    62%  { transform: translate(-50%, -50%) scale(1.12) rotate(-8deg); }
    80%  { transform: translate(-50%, -50%) scale(.96) rotate(-8deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(-8deg); opacity: 1; }
  }

  /* ---------- 水墨山峦 ---------- */
  .ink-mount {
    position: relative; z-index: 5;
    width: 100%; margin-top: -20px; pointer-events: none;
    filter: drop-shadow(0 -4px 12px rgba(70,55,30,.08));
  }
  .ink-mount svg { display: block; width: 100%; height: auto; }

  .foot {
    position: relative; z-index: 6;
    text-align: center; padding: 16px 20px 26px;
    color: var(--ink-3); font-size: 12px; letter-spacing: 2px; line-height: 1.9;
  }

  .toast {
    position: fixed; left: 50%; bottom: 34px; z-index: 90;
    transform: translateX(-50%) translateY(16px);
    background: rgba(51, 41, 31, 0.92); color: #f6efdd;
    padding: 11px 26px; border-radius: 2px;
    font-family: "Ma Shan Zheng", serif; font-size: 16px; letter-spacing: 3px;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
    box-shadow: 0 10px 30px rgba(20,12,4,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bloom-toggle {
    position: fixed; right: 18px; bottom: 18px; z-index: 40;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(166,61,47,.45); background: rgba(250,245,230,.88);
    color: var(--cinnabar); font-family: "Ma Shan Zheng", serif; font-size: 17px;
    cursor: pointer; transition: transform .25s, box-shadow .25s;
    box-shadow: 0 4px 14px rgba(90,60,30,.14);
  }
  .bloom-toggle:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(140,47,34,.24); }

  /* ---------- 过渡页 gate ---------- */
  .gate{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#e4e8e2;color:#1b2b2a;
    font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;-webkit-user-select:none;user-select:none}
  .gate.done{display:none}
  .gate-canvas{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  /* 雾：缓慢漂移的两团白雾，盖在水面之上 */
  .gate-unveil{position:absolute;inset:-10%;z-index:1;pointer-events:none;filter:blur(26px);
    background:radial-gradient(38% 28% at 20% 76%,rgba(255,255,255,.34),transparent 70%),
               radial-gradient(44% 30% at 80% 28%,rgba(255,255,255,.28),transparent 70%);
    animation:gateMist 20s ease-in-out infinite alternate}
  @keyframes gateMist{from{transform:translate3d(-3%,1%,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.08)}}
  .gate-inner{position:relative;z-index:2;height:100%;box-sizing:border-box;padding:0 20px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;pointer-events:none;
    transition:opacity .6s ease,transform .9s ease,filter .9s ease}
  .gate-name{margin:0;font-weight:600;font-size:clamp(44px,9vw,92px);letter-spacing:.35em;padding-left:.35em;
    text-shadow:0 0 18px rgba(236,241,235,.95),0 0 4px rgba(236,241,235,.85)}
  .gate-sub{margin:16px 0 0;font-size:clamp(14px,2vw,18px);letter-spacing:.5em;padding-left:.5em;opacity:.72;
    text-shadow:0 0 10px rgba(236,241,235,.95)}
  .gate-btn{pointer-events:auto;margin-top:44px;font:inherit;font-size:18px;color:inherit;letter-spacing:.5em;
    padding:12px 34px 12px calc(34px + .5em);border:1px solid rgba(27,43,42,.55);border-radius:999px;cursor:pointer;
    background:rgba(238,243,237,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .35s,color .35s,transform .35s}
  .gate-btn:hover{background:rgba(27,43,42,.92);color:#eef2ec;transform:translateY(-1px)}
  .gate-btn:focus-visible{outline:2px solid #1b2b2a;outline-offset:4px}
  .gate-hint{margin:20px 0 0;font-size:13px;letter-spacing:.2em;opacity:.55;text-shadow:0 0 8px rgba(236,241,235,.9)}
  /* 入楼：文字化开，水面由点击处向外裂出一个越来越大的洞（洞由 JS 驱动） */
  .gate.opening .gate-inner{opacity:0;transform:translateY(-10px) scale(1.04);filter:blur(6px);pointer-events:none}
  /* 不支持 WebGL2 时的降级：纯淡出 */
  .gate.nogl{background:radial-gradient(120% 90% at 50% 40%,#eef1ea,#c9d0c8)}
  .gate.nogl.opening{opacity:0;transition:opacity 1s ease .2s}
 

  @media (prefers-reduced-motion: reduce) {
    .scroll, .masthead .brush span, .verse-tag, .ink-mount, .seal { animation: none !important; opacity: 1 !important; }
    .ink-drop { display: none; }
  }
</style>
</head>
<body>

<canvas class="ink-drop" id="petalCanvas" aria-hidden="true"></canvas>

<div class="gate" id="gate">
  <div class="gate-unveil" aria-hidden="true"></div>
  <canvas class="gate-canvas" id="gateCanvas" aria-hidden="true"></canvas>
  <div class="gate-inner">
    <h1 class="gate-name">雾里楼台</h1>
    <p class="gate-sub">烟波起处 · 落笔成楼</p>
    <button class="gate-btn" id="gateBtn" type="button">入楼台</button>
    <p class="gate-hint">轻点水面，墨落生漪 · 点击入楼台</p>
  </div>
</div>

<nav class="topbar">

<script>
(function () {
  "use strict";

  /* ---------- 过渡页：真实流体墨染水面 · 水波 · 入楼 (WebGL2) ---------- */
  (function () {
    var gate = document.getElementById("gate");
    var cv = document.getElementById("gateCanvas");
    var btn = document.getElementById("gateBtn");
    var prevOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = "hidden";
    function finish() {

    }
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      finish();

    }
 
    var gl = cv.getContext("webgl2", { alpha: false, antialias: false });

        gate.classList.add("opening");
        setTimeout(finish, 1300);
      });
      return;
    }
 
    var cfg = { SIM: 150, DYE: 1024, ITER: 20, CURL: 20, VEL_DIS: 0.25, DYE_DIS: 0.05, DIFF: 0.1, FORCE: 5000, INK: 1, SIZE: 1 };
    var OPEN_DELAY = 250, OPEN_DUR = 1500, EDGE = 220;
 
    var VS = "#version 300 es\nout vec2 vUv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}";
    var H = "#version 300 es\nprecision highp float;precision highp sampler2D;in vec2 vUv;out vec4 o;uniform vec2 ts;\n" +
      "#define vL (vUv-vec2(ts.x,0.))\n#define vR (vUv+vec2(ts.x,0.))\n#define vT (vUv+vec2(0.,ts.y))\n#define vB (vUv-vec2(0.,ts.y))\n";
    var FS = {
      splat: "uniform sampler2D uT;uniform float ar,rad;uniform vec3 col;uniform vec2 pt;" +
        "void main(){vec2 p=vUv-pt;p.x*=ar;o=vec4(texture(uT,vUv).rgb+exp(-dot(p,p)/rad)*col,1.);}",
      adv: "uniform sampler2D uV,uS;uniform vec2 vts,ds;uniform float dt,dis,dif;" +
        "void main(){vec2 c=vUv-dt*texture(uV,vUv).xy*vts;vec4 r=texture(uS,c);" +
        "if(dif>0.){vec4 a=(texture(uS,c+vec2(ds.x,0.))+texture(uS,c-vec2(ds.x,0.))+texture(uS,c+vec2(0.,ds.y))+texture(uS,c-vec2(0.,ds.y)))*.25;r=mix(r,a,dif);}" +
        "o=r/(1.+dis*dt);}",
      curl: "uniform sampler2D uV;void main(){float l=texture(uV,vL).y,r=texture(uV,vR).y,t=texture(uV,vT).x,b=texture(uV,vB).x;o=vec4(.5*(r-l-t+b),0.,0.,1.);}",
      vort: "uniform sampler2D uV,uC;uniform float cu,dt;" +
        "void main(){float l=texture(uC,vL).x,r=texture(uC,vR).x,t=texture(uC,vT).x,b=texture(uC,vB).x,c=texture(uC,vUv).x;" +
        "vec2 f=.5*vec2(abs(t)-abs(b),abs(r)-abs(l));f/=length(f)+1e-4;f*=cu*c;f.y*=-1.;" +
        "o=vec4(clamp(texture(uV,vUv).xy+f*dt,-1000.,1000.),0.,1.);}",
      div: "uniform sampler2D uV;" +
        "void main(){float l=texture(uV,vL).x,r=texture(uV,vR).x,t=texture(uV,vT).y,b=texture(uV,vB).y;vec2 c=texture(uV,vUv).xy;" +
        "if(vL.x<0.)l=-c.x;if(vR.x>1.)r=-c.x;if(vT.y>1.)t=-c.y;if(vB.y<0.)b=-c.y;o=vec4(.5*(r-l+t-b),0.,0.,1.);}",
      clear: "uniform sampler2D uT;uniform float val;void main(){o=texture(uT,vUv)*val;}",
      pres: "uniform sampler2D uP,uD;" +
        "void main(){float l=texture(uP,vL).x,r=texture(uP,vR).x,t=texture(uP,vT).x,b=texture(uP,vB).x;o=vec4((l+r+t+b-texture(uD,vUv).x)*.25,0.,0.,1.);}",
      grad: "uniform sampler2D uP,uV;" +
        "void main(){float l=texture(uP,vL).x,r=texture(uP,vR).x,t=texture(uP,vT).x,b=texture(uP,vB).x;o=vec4(texture(uV,vUv).xy-vec2(r-l,t-b),0.,1.);}",
      disp: "uniform sampler2D uD;uniform vec2 dts,res;uniform float t;uniform vec4 rp[8];" +
        "float hf(vec2 p){return sin(p.x*1.3+t*.5+2.*sin(p.y*.7+t*.3))+sin(p.y*1.9-t*.4+2.*sin(p.x*.8-t*.2))+.5*sin((p.x+p.y)*3.1+t*.9);}" +
        "void main(){float d=texture(uD,vUv).r;" +
        "float dl=texture(uD,vUv-vec2(dts.x,0.)).r,dr=texture(uD,vUv+vec2(dts.x,0.)).r,du=texture(uD,vUv+vec2(0.,dts.y)).r,db=texture(uD,vUv-vec2(0.,dts.y)).r;" +
        "float asp=res.x/res.y;vec2 p=vUv*vec2(asp,1.)*5.;vec2 e=vec2(.05,0.);" +
        "vec2 g=vec2(hf(p+e.xy)-hf(p-e.xy),hf(p+e.yx)-hf(p-e.yx))*.2;" +
        "for(int i=0;i<8;i++){float age=t-rp[i].z;if(age<0.||age>5.)continue;" +
        "vec2 dv=(vUv-rp[i].xy)*vec2(asp,1.);float r=length(dv);float f=r-.2*age;" +
        "float env=exp(-f*f*500.)*exp(-age*.7)*rp[i].w;g+=dv/(r+1e-4)*cos(f*80.)*env*.5;}" +
        "vec3 n=normalize(vec3(-g+vec2(dl-dr,db-du)*.8,1.));" +
        "vec2 q=vUv-.5;q.x*=asp;" +
        "vec3 bg=mix(vec3(.925,.94,.915),vec3(.74,.78,.76),smoothstep(.2,.95,length(q)));" +
        "bg*=.82+.26*dot(n,normalize(vec3(-.4,.6,.7)));" +
        "vec3 col=bg*exp(-d*vec3(2.6,2.25,2.15));" +
        "col+=pow(max(dot(n,normalize(vec3(-.1,.18,1.))),0.),150.)*.14;" +
        "col+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;o=vec4(col,1.);}"
    };
 
    function mk(fs) {
      var p = gl.createProgram();
      [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, H + fs]].forEach(function (a) {
        var s = gl.createShader(a[0]); gl.shaderSource(s, a[1]); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        gl.attachShader(p, s);
      });
      gl.linkProgram(p);
      return { p: p, loc: {} };
    }
    var P = {};
    for (var k in FS) P[k] = mk(FS[k]);
 
    function use(pr, o) {
      gl.useProgram(pr.p);
      var unit = 0;
      for (var k in o) {
        var v = o[k];
        var l = pr.loc[k] = pr.loc[k] || gl.getUniformLocation(pr.p, k);
        if (v instanceof WebGLTexture) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v); gl.uniform1i(l, unit++); }
        else if (typeof v === "number") gl.uniform1f(l, v);
        else if (v.length === 2) gl.uniform2f(l, v[0], v[1]);
        else gl.uniform3f(l, v[0], v[1], v[2]);
      }
    }
    function draw(t) {
      if (t) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.f); gl.viewport(0, 0, t.w, t.h); }
      else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height); }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function fbo(w, h) {
      var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
      var f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      return { t: t, f: f, w: w, h: h, ts: [1 / w, 1 / h] };
    }
    function dbl(w, h) {
      var a = fbo(w, h), b = fbo(w, h);
      return { get read() { return a; }, get write() { return b; }, swap: function () { var x = a; a = b; b = x; }, ts: [1 / w, 1 / h] };
    }
    function res(r) {
      var a = cv.width / cv.height; if (a < 1) a = 1 / a;
      var mn = Math.round(r), mx = Math.round(r * a);
      return cv.width > cv.height ? { w: mx, h: mn } : { w: mn, h: mx };
    }
    var vel, dye, pres, div, curl;
    function init() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
      var s = res(cfg.SIM), d = res(cfg.DYE);
      vel = dbl(s.w, s.h); dye = dbl(d.w, d.h); pres = dbl(s.w, s.h); div = fbo(s.w, s.h); curl = fbo(s.w, s.h);
    }
 
    function splat(x, y, dx, dy, amt, rad) {
      var ar = cv.width / cv.height, r = rad / 100; if (ar > 1) r *= ar;
      use(P.splat, { uT: vel.read.t, ar: ar, col: [dx, dy, 0], pt: [x, y], rad: r }); draw(vel.write); vel.swap();
      if (amt > 0) { use(P.splat, { uT: dye.read.t, ar: ar, col: [amt, 0, 0], pt: [x, y], rad: r * 0.6 }); draw(dye.write); dye.swap(); }
    }
    function step(dt) {
      use(P.curl, { uV: vel.read.t, ts: vel.ts }); draw(curl);
      use(P.vort, { uV: vel.read.t, uC: curl.t, ts: vel.ts, cu: cfg.CURL, dt: dt }); draw(vel.write); vel.swap();
      use(P.div, { uV: vel.read.t, ts: vel.ts }); draw(div);
      use(P.clear, { uT: pres.read.t, val: 0.8 }); draw(pres.write); pres.swap();
      for (var i = 0; i < cfg.ITER; i++) { use(P.pres, { uP: pres.read.t, uD: div.t, ts: vel.ts }); draw(pres.write); pres.swap(); }
      use(P.grad, { uP: pres.read.t, uV: vel.read.t, ts: vel.ts }); draw(vel.write); vel.swap();
      use(P.adv, { uV: vel.read.t, uS: vel.read.t, vts: vel.ts, ds: vel.ts, dt: dt, dis: cfg.VEL_DIS, dif: 0 }); draw(vel.write); vel.swap();
      use(P.adv, { uV: vel.read.t, uS: dye.read.t, vts: vel.ts, ds: dye.ts, dt: dt, dis: cfg.DYE_DIS, dif: cfg.DIFF }); draw(dye.write); dye.swap();
    }
 
    // 水波：最多 8 圈同时存在，xy=位置 z=起始时间 w=强度
    var rpa = new Float32Array(32), rpi = 0, T0 = performance.now();
    for (var i = 0; i < 8; i++) rpa[i * 4 + 2] = -100;
    function now() { return (performance.now() - T0) / 1000; }
    function ripple(x, y, amp) {
      rpa[rpi * 4] = x; rpa[rpi * 4 + 1] = y; rpa[rpi * 4 + 2] = now(); rpa[rpi * 4 + 3] = amp;
      rpi = (rpi + 1) % 8;
    }
    function render() {
      use(P.disp, { uD: dye.read.t, dts: dye.ts, res: [cv.width, cv.height], t: now() });
      gl.uniform4fv(gl.getUniformLocation(P.disp.p, "rp"), rpa);
      draw(null);
    }
 
    // 墨滴：中心落墨 + 一圈向外的小冲击，墨就会拉出丝状的细流
    function drop(x, y, k, burst) {
      var s = cfg.SIZE;
      splat(x, y, 0, 0, cfg.INK * 2.2 * k, 0.35 * s);
      var n = burst ? 16 : 8, v = burst ? 620 : 260;
      for (var i = 0; i < n; i++) {
        var a = i / n * 6.283 + Math.random() * 0.6;
        splat(x + Math.cos(a) * 0.004, y + Math.sin(a) * 0.004, Math.cos(a) * v, Math.sin(a) * v, 0, 0.08 * s);
      }
      ripple(x, y, 0.8 + 0.2 * Math.min(k, 2));
    }
 
    // 指针
    var p = { x: 0.5, y: 0.5, lx: 0.5, ly: 0.5, down: false, active: false };
    var opening = false;
    function setPos(e) { p.x = e.clientX / innerWidth; p.y = 1 - e.clientY / innerHeight; }
    gate.addEventListener("pointerdown", function (e) {
      if (opening || e.button !== 0 || (e.target.closest && e.target.closest("button"))) return;
      gate.setPointerCapture(e.pointerId); setPos(e);
      p.down = true; p.active = true; p.lx = p.x; p.ly = p.y;
      drop(p.x, p.y, 0.6, false);
    });
    gate.addEventListener("pointermove", function (e) {
      if (opening) return;
      setPos(e); if (!p.active) { p.active = true; p.lx = p.x; p.ly = p.y; }
    });
    function up() { p.down = false; }
    gate.addEventListener("pointerup", up);
    gate.addEventListener("pointercancel", up);
    gate.addEventListener("pointerleave", function () { if (!p.down) p.active = false; });
    function applyInput() {
      if (!p.active || opening) return;
      var ar = cv.width / cv.height, dx = p.x - p.lx, dy = p.y - p.ly, dist = Math.hypot(dx, dy);
      if (dist === 0 && !p.down) return;
      if (ar < 1) dx *= ar; if (ar > 1) dy /= ar;
      var n = Math.max(1, Math.min(12, Math.ceil(dist * 100)));
      var kf = p.down ? 1 : 0.6, rad = (p.down ? 0.2 : 0.25) * cfg.SIZE;
      for (var i = 1; i <= n; i++) {
        var t = i / n;
        splat(p.lx + (p.x - p.lx) * t, p.ly + (p.y - p.ly) * t, dx * cfg.FORCE * kf / n, dy * cfg.FORCE * kf / n, p.down ? 0.22 * cfg.INK : 0, rad);
      }
      p.lx = p.x; p.ly = p.y;
    }
 
    // 入楼台：落一大滴墨，连起三圈水波，水面从点击处裂开一个越来越大的洞
    var ox = 0, oy = 0, openT = 0, maxR = 0, raf = 0;
    btn.addEventListener("click", function () {
      if (opening) return;
      opening = true; p.down = false; p.active = false;
      gate.classList.add("opening");
      var b = btn.getBoundingClientRect();
      ox = b.left + b.width / 2; oy = b.top + b.height / 2;
      var ux = ox / innerWidth, uy = 1 - oy / innerHeight;
      drop(ux, uy, 2.4, true);
      setTimeout(function () { ripple(ux, uy, 1.2); }, 150);
      setTimeout(function () { ripple(ux, uy, 1.0); }, 320);
      maxR = Math.max(Math.hypot(ox, oy), Math.hypot(innerWidth - ox, oy), Math.hypot(ox, innerHeight - oy), Math.hypot(innerWidth - ox, innerHeight - oy));
      openT = performance.now() + OPEN_DELAY;
    });
    function setHole(R) {
      var m = "radial-gradient(circle at " + ox + "px " + oy + "px, transparent " + R + "px, #000 " + (R + EDGE) + "px)";
      gate.style.webkitMaskImage = m; gate.style.maskImage = m;
    }
 
    var nextAmb = 0, last = performance.now();
    function frame(t) {
      var dt = Math.min((t - last) / 1000, 0.0167) || 0.0167; last = t;
      if (!opening && t > nextAmb) { // 平时偶尔落一圈雨点似的涟漪
        ripple(0.1 + Math.random() * 0.8, 0.1 + Math.random() * 0.8, 0.5);
        nextAmb = t + 2200 + Math.random() * 2400;
      }
      applyInput(); step(dt); render();
      if (opening) {
        var k = Math.min(1, Math.max(0, (t - openT) / OPEN_DUR));
        var e = 1 - Math.pow(1 - k, 3);

        if (k >= 1) {
          finish();
          var ext = gl.getExtension("WEBGL_lose_context"); if (ext) ext.loseContext();

        }

    }
 
    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (!opening) init(); }, 200); });
 
    init();
    setTimeout(function () { drop(0.38, 0.56, 1, false); setTimeout(function () { drop(0.63, 0.44, 0.8, false); }, 500); }, 350);
    raf = requestAnimationFrame(frame);
  })();
 

  /* ---------- 时辰 ---------- */
  var SHICHEN = ["子时","丑时","寅时","卯时","辰时","巳时","午时","未时","申时","酉时","戌时","亥时"];
  function shichen(h) { return SHICHEN[Math.floor(((h + 1) % 24) / 2)]; }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function tickClock() {
    var d = new Date();
    var h = d.getHours();
    document.getElementById("navClock").textContent =
      shichen(h) + " " + pad(h) + ":" + pad(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock, 30000);

  /* ---------- 诗签 ---------- */
  var VERSES = [
    "文章本天成，妙手偶得之。——陆游",
    "两句三年得，一吟双泪流。——贾岛",
    "清水出芙蓉，天然去雕饰。——李白",
    "笔落惊风雨，诗成泣鬼神。——杜甫",
    "我手写我心，我笔即我情。",
    "纸上得来终觉浅，绝知此事要躬行。——陆游",
    "言为心声，墨为心迹。",
    "粗缯大布裹生涯，腹有诗书气自华。——苏轼"
  ];
  document.getElementById("verseText").textContent =
    VERSES[Math.floor(Math.random() * VERSES.length)];

  /* ---------- 存储 ---------- */
  var KEY = "jdc.writings";
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function persist(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); return true; }
    catch (e) { toast("墨池已满，先删去几篇旧稿再存"); return false; }
  }

  /* ---------- 组件 ---------- */
  var listEl = document.getElementById("list");
  var listCountEl = document.getElementById("listCount");
  var titleEl = document.getElementById("title");
  var kindEl = document.getElementById("kind");
  var bodyEl = document.getElementById("body");
  var countEl = document.getElementById("count");
  var modeHint = document.getElementById("modeHint");
  var editingId = null;
  var SAVE_WORDS = ["墨迹已收，来日可读", "笔落成章，已入藏稿", "此稿已收，静待重读", "落墨为凭，存档于心"];
  var DEL_WORDS = ["已焚此稿", "弃稿不存", "一笔勾销"];

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function charCount(s) {
    return String(s || "").replace(/\s/g, "").length;
  }

  function stamp(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) +
      " " + shichen(d.getHours()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- 盖印 ---------- */
  function sealStamp() {
    var seal = document.getElementById("seal");
    seal.classList.remove("show");
    void seal.offsetWidth;
    seal.classList.add("show");
    setTimeout(function () { seal.classList.remove("show"); }, 1300);
  }

  /* ---------- 渲染存档 ---------- */
  function render() {
    var items = load().sort(function (a, b) { return b.ts - a.ts; });
    listCountEl.textContent = items.length + " 篇";

    var totalChars = 0, thisWeek = 0, weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    items.forEach(function (x) {
      totalChars += charCount(x.body);
      if (x.ts >= weekAgo) thisWeek += 1;
    });
    document.getElementById("statsLine").textContent =
      "共 " + items.length + " 篇 · " + totalChars.toLocaleString() + " 字 · 近七日新得 " + thisWeek + " 篇";

    listEl.textContent = "";
    if (!items.length) {
      var box = document.createElement("div");
      box.className = "empty";
      var strong = document.createElement("strong");
      strong.textContent = "藏稿尚空";
      var p = document.createElement("p");
      p.textContent = "研墨写下第一句，收墨之后，此处即添一页。";
      box.appendChild(strong); box.appendChild(p);
      listEl.appendChild(box);
      return;
    }

    items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "entry";

      var main = document.createElement("div");
      main.className = "entry-main";

      var open = document.createElement("button");
      open.type = "button";
      open.className = "entry-open";
      open.textContent = item.title || "无题";
      open.addEventListener("click", function () { read(item); });

      var meta = document.createElement("div");
      meta.className = "entry-meta";
      meta.textContent = stamp(item.ts) + " · " + (item.kind || "日记") + " · " + charCount(item.body) + " 字";

      main.appendChild(open); main.appendChild(meta);

      var actions = document.createElement("div");
      actions.className = "entry-actions";

      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "mini-btn";
      editBtn.textContent = "续笔";
      editBtn.addEventListener("click", function () { edit(item.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "mini-btn";
      del.textContent = "焚稿";
      del.addEventListener("click", function () { remove(item.id, item.title); });

      actions.appendChild(editBtn); actions.appendChild(del);
      row.appendChild(main); row.appendChild(actions);
      listEl.appendChild(row);
    });
  }

  /* ---------- 展卷阅读 ---------- */
  function read(item) {
    var reader = document.getElementById("reader");
    document.getElementById("readerTitle").textContent = item.title || "无题";
    document.getElementById("readerMeta").textContent =
      stamp(item.ts) + " · " + (item.kind || "日记");
    document.getElementById("readerBody").textContent = item.body || "";
    reader.classList.add("show");
    document.body.style.overflow = "hidden";
    setTimeout(function () {
      var b = document.getElementById("readerBody");
      b.scrollTop = 0; b.scrollLeft = b.scrollWidth;
    }, 20);
  }
  function closeReader() {
    var reader = document.getElementById("reader");
    reader.classList.remove("show");
    document.body.style.overflow = "";
  }
  document.getElementById("readerVeil").addEventListener("click", closeReader);
  document.getElementById("readerClose").addEventListener("click", closeReader);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeReader();
  });

  /* ---------- 编辑 / 删除 ---------- */
  function edit(id) {
    var item = load().filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    editingId = item.id;
    titleEl.value = item.title || "";
    kindEl.value = item.kind || "日记";
    bodyEl.value = item.body || "";
    countEl.textContent = charCount(bodyEl.value);
    modeHint.textContent = "续写 · " + stamp(item.ts);
    document.getElementById("save").textContent = "改讫";
    titleEl.scrollIntoView({ block: "start", behavior: "smooth" });
    toast("已调出旧稿");
  }

  function remove(id, title) {
    if (!window.confirm("欲焚此稿《" + (title || "无题") + "》，焚后不复可得，确乎？")) return;
    var items = load().filter(function (x) { return x.id !== id; });
    if (!persist(items)) return;
    if (editingId === id) resetForm();
    render();
    toast(DEL_WORDS[Math.floor(Math.random() * DEL_WORDS.length)]);
  }

  function resetForm() {
    editingId = null;
    titleEl.value = "";
    bodyEl.value = "";
    countEl.textContent = "0";
    modeHint.textContent = "新起一篇";
    document.getElementById("save").textContent = "收墨";
  }

  function save() {
    var body = bodyEl.value;
    if (!body.trim() && !titleEl.value.trim()) {
      toast("纸犹空白，未可收墨");
      return;
    }
    var title = titleEl.value.trim();
    if (!title) {
      var firstLine = body.split("\n").filter(function (l) { return l.trim(); })[0] || "";
      title = firstLine.trim().slice(0, 18) || "无题";
    }

    var items = load();
    var now = Date.now();
    if (editingId) {
      var hit = false;
      items = items.map(function (x) {
        if (x.id !== editingId) return x;
        hit = true;
        return { id: x.id, title: title, kind: kindEl.value, body: body, ts: now, created: x.created || x.ts };
      });
      if (!hit) items.push({ id: String(now), title: title, kind: kindEl.value, body: body, ts: now, created: now });
    } else {
      items.push({ id: String(now), title: title, kind: kindEl.value, body: body, ts: now, created: now });
    }

    if (!persist(items)) return;
    render();
    resetForm();
    sealStamp();
    toast(SAVE_WORDS[Math.floor(Math.random() * SAVE_WORDS.length)]);
  }

  bodyEl.addEventListener("input", function () {
    countEl.textContent = charCount(bodyEl.value);
  });

  document.getElementById("save").addEventListener("click", save);
  document.getElementById("reset").addEventListener("click", function () {
    if (bodyEl.value.trim() && !window.confirm("弃去当前笔墨？未收的会散失。")) return;
    resetForm();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
  });

  /* ---------- 落花 ---------- */
  var petals = [];
  var petalRunning = true;
  var cv = document.getElementById("petalCanvas");
  var ctx = cv.getContext("2d");
  var COLORS = ["rgba(166,61,47,", "rgba(196,120,60,", "rgba(160,140,90,"];
  function sizeCanvas() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }
  sizeCanvas();
  window.addEventListener("resize", sizeCanvas);

  function makePetal(init) {
    return {
      x: Math.random() * cv.width,
      y: init ? Math.random() * cv.height : -24,
      r: 2.5 + Math.random() * 3.5,
      vy: 0.35 + Math.random() * 0.75,
      vx: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.04,
      c: COLORS[Math.floor(Math.random() * COLORS.length)] + (0.28 + Math.random() * 0.22) + ")"
    };
  }
  for (var i = 0; i < 16; i++) petals.push(makePetal(true));

  function petalLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    petals.forEach(function (p, idx) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.vx += (Math.random() - 0.5) * 0.02;
      if (p.y > cv.height + 30) { petals[idx] = makePetal(false); return; }
      if (p.x < -30) p.x = cv.width + 20;
      if (p.x > cv.width + 30) p.x = -20;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * 1.25, p.r * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    if (petalRunning) requestAnimationFrame(petalLoop);
  }
  petalLoop();

  document.getElementById("bloomToggle").addEventListener("click", function () {
    petalRunning = !petalRunning;
    if (petalRunning) { petalLoop(); this.textContent = "花"; toast("落花又起"); }
    else { ctx.clearRect(0, 0, cv.width, cv.height); this.textContent = "静"; toast("花落已歇"); }
  });

  render();
})();
</script>

</body>
</html>
