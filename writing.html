  </ul>
  <span class="topbar-clock" id="navClock">--:--</span>
</nav>

<main class="page">
  <p class="crumb"><a href="index.html">总台</a><span>/</span><span>创作</span></p>
  <h1 class="page-title">雾里楼台已迁走</h1>
  <p class="page-desc">写作页已并入独立站点「雾里楼台」，马上带你过去。</p>

  <div class="work" style="grid-template-columns:1fr">
    <section class="work-cell" style="text-align:center;padding:34px 20px">
      <p style="font-family:var(--serif);font-size:19px;color:var(--ink-2);line-height:2">
        新址：<a href="https://kinghihido.github.io/wuliloutai-writing/" target="_blank" rel="noopener" style="color:var(--accent)">kinghihido.github.io/wuliloutai-writing</a>
      </p>
      <p class="hint" id="legacyNote" hidden>
        旧页的稿子还留在本机浏览器里（<span id="legacyCount">0</span> 篇），先导出存好再去新站吧。
      </p>
      <p style="margin-top:22px">
        <a class="btn" id="goBtn" href="https://kinghihido.github.io/wuliloutai-writing/" target="_blank" rel="noopener">前往雾里楼台</a>
        <button class="btn" id="exportBtn" type="button" hidden>导出旧稿（JSON）</button>
      </p>
      <p class="hint" style="margin-top:18px" id="countdown">2 秒后自动跳转…</p>
    </section>
  </div>
</main>

<footer class="foot">
  <p>静态站点 · GitHub Pages · 内容只保存在本机浏览器</p>
  <p>kinghihido · 2026</p>
</footer>

<script>
(function () {
  "use strict";
  var NEW_URL = "https://kinghihido.github.io/wuliloutai-writing/";
  var KEY = "jdc.writings";

  function pad(n) { return n < 10 ? "0" + n : String(n); }
  var d = new Date();
  document.getElementById("navClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());

  var drafts = [];
  try {
    var v = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (Array.isArray(v)) drafts = v;
  } catch (e) {}

  var countdownEl = document.getElementById("countdown");
  var go = function () { window.location.replace(NEW_URL); };

  if (drafts.length) {
    document.getElementById("legacyNote").hidden = false;
    document.getElementById("legacyCount").textContent = drafts.length;
    var exportBtn = document.getElementById("exportBtn");
    exportBtn.hidden = false;
    countdownEl.textContent = "有旧稿未导出，已暂停自动跳转";
    exportBtn.addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(drafts, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "wuliloutai-legacy-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      countdownEl.textContent = "已导出，2 秒后自动跳转…";
      setTimeout(go, 2000);
    });
  } else {
    var n = 2;
    var timer = setInterval(function () {
      n -= 1;
      if (n <= 0) { clearInterval(timer); go(); return; }
      countdownEl.textContent = n + " 秒后自动跳转…";
    }, 1000);
    document.getElementById("goBtn").addEventListener("click", function (e) { e.preventDefault(); go(); });
  }
})();
</script>

</body>
</html>
