<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾里楼台 · 集大成者</title>
<meta name="description" content="集大成者的文学创作「雾里楼台」：日记、随感、长文，皆收于此。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f1e3'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23a63d2f' font-family='serif'%3E雾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e3;
    --paper-deep: #efe7d2;
    --ink: #33291f;
    --ink-2: #5c5142;
    --ink-3: #8a7b67;
    --cinnabar: #a63d2f;
    --cinnabar-deep: #8c2f22;
    --teal: #3f5d57;
    --line: rgba(51, 41, 31, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(180, 160, 120, 0.10), transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(120, 140, 120, 0.08), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(120, 105, 80, 0.020) 3px 4px),
      var(--paper);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before { /* 宣纸纤维噪点 */
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(rgba(90, 75, 55, 0.035) 0.6px, transparent 0.8px),
      radial-gradient(rgba(90, 75, 55, 0.028) 0.5px, transparent 0.7px);
    background-size: 37px 43px, 61px 67px;
    pointer-events: none; z-index: 1;
  }
  .ink-drop { /* 飘落花瓣画布 */
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
  }

  /* ---------- 顶部导航 ---------- */
  .topbar {
    position: relative; z-index: 20;
    display: flex; align-items: center; gap: 26px;
    padding: 14px clamp(18px, 4vw, 44px);
    border-bottom: 1px solid var(--line);
    background: rgba(246, 241, 227, 0.82);
    backdrop-filter: blur(6px);
  }
  .brand {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 23px; letter-spacing: 2px; color: var(--cinnabar);
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  }
  .brand .seal-mark {
    width: 9px; height: 9px; background: var(--cinnabar);
    transform: rotate(45deg); flex-shrink: 0;
  }
  .nav { display: flex; list-style: none; gap: 4px; flex-wrap: wrap; }
  .nav a {
    display: block; padding: 6px 12px; color: var(--ink-2);
    text-decoration: none; font-size: 15px; letter-spacing: 1px;
    border-bottom: 2px solid transparent; transition: color .25s, border-color .25s;
  }
  .nav a:hover { color: var(--cinnabar); }
  .nav a[aria-current="page"] { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }
  .topbar-clock {
    margin-left: auto; font-size: 13px; color: var(--ink-3);
    letter-spacing: 1px; white-space: nowrap; font-family: "Ma Shan Zheng", serif; font-size: 15px;
  }

  /* ---------- 主卷轴 ---------- */
  .scroll-wrap {
    position: relative; z-index: 10;
    max-width: 920px; margin: 0 auto;
    padding: 34px 18px 60px;
  }
  .scroll {
    position: relative;
    background: linear-gradient(180deg, #fbf7ea, #f3ecda 60%, #efe6d0);
    border: 1px solid rgba(51, 41, 31, 0.12);
    border-radius: 3px;
    box-shadow: 0 18px 48px rgba(70, 55, 30, 0.14), 0 2px 8px rgba(70, 55, 30, 0.08);
    padding: clamp(26px, 6vw, 64px) clamp(20px, 6vw, 72px) 54px;
  }
  .scroll::before, .scroll::after { /* 卷轴上下木杆 */
    content: ""; position: absolute; left: 0; right: 0; height: 9px;
    background: linear-gradient(180deg, #c9b894, #a18a5f 45%, #7d6844);
    border-radius: 2px;
  }
  .scroll::before { top: -5px; box-shadow: 0 2px 5px rgba(60,45,20,.25); }
  .scroll::after { bottom: -5px; box-shadow: 0 -2px 5px rgba(60,45,20,.22); }

  .scroll-inner { position: relative; }

  /* 角印花纹 */
  .corner { position: absolute; width: 46px; height: 46px; opacity: .5; pointer-events: none; }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 14px; left: 14px; transform: rotate(0); }
  .corner.br { bottom: 14px; right: 14px; transform: rotate(180deg); }

  /* ---------- 题头 ---------- */
  .masthead { text-align: center; margin-bottom: 26px; }
  .masthead .brush {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: clamp(46px, 9vw, 74px);
    line-height: 1.15; color: var(--ink); letter-spacing: 12px;
    text-shadow: 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(90,70,40,.16);
    user-select: none;
  }
  .masthead .sub {
    margin-top: 6px; color: var(--ink-3); font-size: 13px; letter-spacing: 6px;
  }
  .masthead .rule {
    display: flex; align-items: center; gap: 14px;
    margin: 20px auto 0; max-width: 320px;
  }
  .masthead .rule::before, .masthead .rule::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .masthead .rule .dot { width: 6px; height: 6px; background: var(--cinnabar); border-radius: 50%; }

  /* 诗签 */
  .verse-tag {
    max-width: 460px; margin: 22px auto 0;
    padding: 14px 22px 14px 26px;
    position: relative;
    border: 1px solid rgba(166,61,47,.35);
    border-left: 3px solid var(--cinnabar);
    background: rgba(255, 250, 236, 0.6);
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 18px; letter-spacing: 2px; color: var(--ink-2);
    transform: rotate(-0.4deg);
    transition: transform .35s, box-shadow .35s;
    box-shadow: 0 2px 10px rgba(90,60,30,.08);
  }
  .verse-tag:hover { transform: rotate(0deg) translateY(-2px); box-shadow: 0 8px 22px rgba(90,60,30,.14); }
  .verse-tag .qmark {
    position: absolute; left: -9px; top: -10px;
    background: var(--cinnabar); color: #fdf6e6;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-family: serif;
  }

  /* ---------- 写作区 ---------- */
  .section-label {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Ma Shan Zheng", serif; font-size: 22px; letter-spacing: 4px;
    color: var(--ink); margin: 30px 0 14px;
  }
  .section-label::before {
    content: ""; width: 8px; height: 8px; background: var(--cinnabar); transform: rotate(45deg);
  }

  .work-grid {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
    gap: 22px; align-items: start;
  }
  @media (max-width: 760px) { .work-grid { grid-template-columns: 1fr; } }

  .sheet {
    background: #fbf7ea;
    border: 1px solid rgba(51,41,31,.14);
    padding: 22px 22px 18px;
    position: relative;
    box-shadow: inset 0 0 30px rgba(120,100,70,.06);
  }
  .sheet::before {
    content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(180deg, transparent, var(--line) 8%, var(--line) 92%, transparent);
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .sheet-title { font-family: "Ma Shan Zheng", serif; font-size: 20px; letter-spacing: 3px; color: var(--cinnabar-deep); }
  .hint { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--ink-2); letter-spacing: 2px; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 12px;
    font-family: "Noto Serif SC", serif; font-size: 15px;
    color: var(--ink); background: rgba(255,253,246,.7);
    border: 1px solid var(--line); border-radius: 2px;
    outline: none; transition: border-color .25s, box-shadow .25s;
  }
  .field input:focus, .field select:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(166,61,47,.12); }
  .field select { cursor: pointer; }

  .field textarea {
    width: 100%; min-height: 240px; resize: vertical;
    padding: 14px 16px;
    font-family: "Noto Serif SC", serif; font-size: 16px; line-height: 2.1;
    color: var(--ink); background: rgba(255,253,246,.75);
    border: 1px solid var(--line); border-radius: 2px; outline: none;
    background-image:
      linear-gradient(transparent 1.9em, rgba(51,41,31,.055) 2em);
    background-size: 100% 2.1em; /* 稿纸横格 */
    transition: border-color .25s, box-shadow .25s;
  }
  .field textarea:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(166,61,47,.12); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .toolbar-end { display: flex; gap: 10px; }

  /* 墨晕按钮 */
  .btn {
    position: relative; overflow: hidden;
    padding: 8px 22px; cursor: pointer;
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif; font-size: 17px; letter-spacing: 3px;
    color: #fbf5e6; background: var(--ink);
    border: 1px solid var(--ink); border-radius: 2px;
    transition: background .3s, color .3s, box-shadow .3s;
  }
  .btn::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 0; height: 0; border-radius: 50%;
    background: rgba(255, 250, 235, 0.35);
    transform: translate(-50%, -50%);
    transition: width .45s ease-out, height .45s ease-out, opacity .45s;
    opacity: 0; pointer-events: none;
  }
  .btn:hover::after { width: 260px; height: 260px; opacity: 1; }
  .btn:hover { background: var(--cinnabar-deep); border-color: var(--cinnabar-deep); box-shadow: 0 6px 18px rgba(140,47,34,.28); }
  .btn-ghost {
    color: var(--ink-2); background: transparent; border-color: var(--line);
  }
  .btn-ghost:hover { background: rgba(51,41,31,.06); color: var(--ink); border-color: var(--ink-3); box-shadow: none; }
  .btn-ghost::after { display: none; }

  /* ---------- 存档 ---------- */
  .archive { margin-top: 8px; }
  .entry {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px 12px 20px; margin-bottom: 10px;
    background: #faf5e6; border: 1px solid rgba(51,41,31,.10);
    border-left: 3px solid var(--cinnabar);
    position: relative;
    transition: transform .25s, box-shadow .25s, border-color .25s;
  }
  .entry:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(90,60,30,.12); border-color: rgba(51,41,31,.28); }
  .entry-main { min-width: 0; flex: 1; }
  .entry-open {
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: "Ma Shan Zheng", serif; font-size: 19px; letter-spacing: 2px;
    color: var(--ink); text-align: left; line-height: 1.4;
  }
  .entry-open:hover { color: var(--cinnabar); text-decoration: underline; text-underline-offset: 4px; }
  .entry-meta { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; margin-top: 3px; }
  .entry-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .mini-btn {
    font-family: "Noto Serif SC", serif; font-size: 12px; letter-spacing: 1px;
    color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); padding: 4px 10px; cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .mini-btn:hover { color: var(--cinnabar); border-color: var(--cinnabar); background: rgba(166,61,47,.06); }
  .empty { text-align: center; padding: 34px 10px; color: var(--ink-3); }
  .empty strong { display: block; font-family: "Ma Shan Zheng", serif; font-size: 21px; color: var(--ink-2); letter-spacing: 3px; font-weight: 400; }
  .empty p { font-size: 13px; margin-top: 6px; letter-spacing: 1px; }

  /* ---------- 阅读弹层（竖排卷轴） ---------- */
  .reader { position: fixed; inset: 0; z-index: 60; display: none; }
  .reader.show { display: block; }
  .reader .veil {
    position: absolute; inset: 0; background: rgba(30, 24, 14, 0.55);
    backdrop-filter: blur(3px);
    animation: veilIn .3s ease both;
  }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
  .reader .vol {
    position: absolute; left: 50%; top: 50%;
    width: min(560px, 92vw); height: min(600px, 84vh);
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, #f2e8d2, #fbf5e4 12%, #f6eedb 88%, #eee2c8);
    border: 1px solid rgba(60,45,20,.25);
    box-shadow: 0 30px 80px rgba(20,12,4,.5);
    padding: 34px 44px 30px 40px;
    animation: volIn .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes volIn { from { transform: translate(-50%, -46%) scale(.92); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .reader .vol::before, .reader .vol::after {
    content: ""; position: absolute; left: 0; right: 0; height: 8px;
    background: linear-gradient(180deg, #b39a6a, #8f7447 50%, #6e5a35);
    border-radius: 2px;
  }
  .reader .vol::before { top: -4px; }
  .reader .vol::after { bottom: -4px; }
  .reader .vol-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 10px; border-bottom: 1px solid rgba(60,45,20,.18);
    margin-bottom: 12px;
  }
  .reader .vol-title {
    font-family: "Ma Shan Zheng", serif; font-size: 22px; letter-spacing: 3px; color: var(--cinnabar-deep);
  }
  .reader .vol-meta { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; }
  .reader .vol-body {
    height: calc(100% - 56px); overflow: auto;
    writing-mode: vertical-rl; text-orientation: upright;
    font-size: 17px; line-height: 2.05; letter-spacing: 2px;
    color: var(--ink); padding: 6px 2px;
    scrollbar-width: thin; scrollbar-color: rgba(140,47,34,.4) transparent;
  }
  .reader .vol-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .reader .vol-body::-webkit-scrollbar-thumb { background: rgba(140,47,34,.35); border-radius: 3px; }
  .reader .vol-close {
    position: absolute; top: 12px; right: 14px;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(60,45,20,.3); background: rgba(250,245,230,.9);
    color: var(--ink-2); font-size: 16px; cursor: pointer;
    font-family: "Ma Shan Zheng", serif;
    transition: transform .2s, color .2s, border-color .2s;
  }
  .reader .vol-close:hover { transform: rotate(90deg); color: var(--cinnabar); border-color: var(--cinnabar); }

  /* ---------- 盖印 ---------- */
  .seal {
    position: fixed; left: 50%; top: 42%; z-index: 80;
    transform: translate(-50%, -50%) scale(3) rotate(-8deg);
    width: 118px; height: 118px;
    display: none; align-items: center; justify-content: center;
    border: 4px solid var(--cinnabar); color: var(--cinnabar);
    font-family: "Ma Shan Zheng", serif; font-size: 30px; letter-spacing: 4px;
    text-align: center; line-height: 1.25;
    box-shadow: 0 6px 24px rgba(140,47,34,.35);
    pointer-events: none;
    animation: sealStamp .9s cubic-bezier(.2,.9,.35,1.4) both;
  }
  .seal.show { display: flex; }
  @keyframes sealStamp {
    0%   { transform: translate(-50%, -190%) scale(1.6) rotate(-14deg); opacity: 0; }
    45%  { transform: translate(-50%, -50%) scale(.9) rotate(-4deg); opacity: 1; }
    62%  { transform: translate(-50%, -50%) scale(1.12) rotate(-8deg); }
    80%  { transform: translate(-50%, -50%) scale(.96) rotate(-8deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(-8deg); opacity: 1; }
  }

  /* ---------- 水墨山峦 ---------- */
  .ink-mount {
    position: relative; z-index: 5;
    width: 100%; margin-top: -20px; pointer-events: none;
    filter: drop-shadow(0 -4px 12px rgba(70,55,30,.08));
  }
  .ink-mount svg { display: block; width: 100%; height: auto; }

  .foot {
    position: relative; z-index: 6;
    text-align: center; padding: 16px 20px 26px;
    color: var(--ink-3); font-size: 12px; letter-spacing: 2px; line-height: 1.9;
  }

  .toast {
    position: fixed; left: 50%; bottom: 34px; z-index: 90;
    transform: translateX(-50%) translateY(16px);
    background: rgba(51, 41, 31, 0.92); color: #f6efdd;
    padding: 11px 26px; border-radius: 2px;
    font-family: "Ma Shan Zheng", serif; font-size: 16px; letter-spacing: 3px;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
    box-shadow: 0 10px 30px rgba(20,12,4,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bloom-toggle {
    position: fixed; right: 18px; bottom: 18px; z-index: 40;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(166,61,47,.45); background: rgba(250,245,230,.88);
    color: var(--cinnabar); font-family: "Ma Shan Zheng", serif; font-size: 17px;
    cursor: pointer; transition: transform .25s, box-shadow .25s;
    box-shadow: 0 4px 14px rgba(90,60,30,.14);
  }
  .bloom-toggle:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(140,47,34,.24); }

  /* ---------- 过渡页：水面 · 墨滴 · 入楼 ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 130%, rgba(255,255,255,0.14), transparent 62%),
      radial-gradient(ellipse at 18% -8%, rgba(210,230,225,0.35), transparent 55%),
      linear-gradient(180deg, #c9d6d1 0%, #9db1ab 45%, #6b8780 100%);
    overflow: hidden;
  }
  .gate.opening { opacity: 0; transition: opacity .55s ease 1.02s; }
  .gate.done { visibility: hidden; pointer-events: none; }
  .gate-unveil {
    position: absolute; left: 50%; top: 50%;
    width: 200vmax; height: 200vmax;
    margin-left: -100vmax; margin-top: -100vmax;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fbf6e8, #efe6d0 78%);
    box-shadow: 0 0 120px rgba(246,241,227,.9);
    transform: scale(0);
    transform-origin: center;
    z-index: 3; pointer-events: none;
    will-change: transform;
  }
  .gate.opening .gate-unveil {
    transform: scale(1);
    transition: transform 1s cubic-bezier(.7,0,.3,1);
  }
  .gate-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gate-inner {
    position: relative; z-index: 2; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .gate-name {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: clamp(58px, 12vw, 108px);
    color: #f6efdf; letter-spacing: 16px; line-height: 1.1;
    text-shadow: 0 5px 26px rgba(15,25,25,.5), 0 0 70px rgba(245,240,220,.18);
    user-select: none;
  }
  .gate-sub {
    margin-top: 12px; font-size: 15px; letter-spacing: 8px;
    color: rgba(246,239,223,.85); text-shadow: 0 2px 10px rgba(15,25,25,.4);
  }
  .gate-btn {
    margin-top: 48px; width: 138px; height: 138px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #c25040, #a63d2f 58%, #86301f);
    color: #f8f1e0; border: 3px solid rgba(248,241,224,.9);
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 27px; letter-spacing: 5px; text-indent: 5px;
    cursor: pointer; position: relative;
    box-shadow: 0 12px 34px rgba(20,12,4,.38), inset 0 -8px 16px rgba(60,10,6,.35), inset 0 6px 14px rgba(255,220,200,.25);
    transition: transform .22s, box-shadow .22s;
  }
  .gate-btn:hover { transform: scale(1.07); box-shadow: 0 16px 40px rgba(20,12,4,.42), inset 0 -8px 16px rgba(60,10,6,.35); }
  .gate-btn:active { transform: scale(.95); }
  .gate-hint {
    margin-top: 20px; font-size: 12px; letter-spacing: 3px;
    color: rgba(246,239,223,.55);
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll, .masthead .brush span, .verse-tag, .ink-mount, .seal { animation: none !important; opacity: 1 !important; }
    .ink-drop { display: none; }
    .gate { display: none; }
  }
</style>
</head>
<body>

<canvas class="ink-drop" id="petalCanvas" aria-hidden="true"></canvas>

<div class="gate" id="gate">
  <div class="gate-unveil" aria-hidden="true"></div>
  <canvas class="gate-canvas" id="gateCanvas" aria-hidden="true"></canvas>
  <div class="gate-inner">
    <h1 class="gate-name">雾里楼台</h1>
    <p class="gate-sub">烟波起处 · 落笔成楼</p>
    <button class="gate-btn" id="gateBtn" type="button">入楼台</button>
    <p class="gate-hint">轻点水面，墨落生漪 · 点击入楼台</p>
  </div>
</div>

<nav class="topbar">

<script>
(function () {
  "use strict";

  /* ---------- 过渡页：水面 · 墨滴 · 水波 · 入楼 ---------- */
  var gate = document.getElementById("gate");
  var gcv = document.getElementById("gateCanvas");
  var gctx = gcv.getContext("2d");
  var ripples = [];
  var inks = [];
  var rings = [];
  function rnd(v) { return Math.random() * v; }
  function sizeGate() {
    gcv.width = window.innerWidth;
    gcv.height = window.innerHeight;
  }
  sizeGate();
  window.addEventListener("resize", sizeGate);

  setInterval(function () {
    ripples.push({ x: rnd(gcv.width), y: rnd(gcv.height), r: 4, max: 70 + rnd(130), o: 0.3 });
    if (ripples.length > 26) ripples.shift();
  }, 1500);

  function spawnInk(x, y) {
    inks.push({ x: x, y: y, r: 2, max: 55 + rnd(75), o: 0.85 });
  }

  function gateLoop() {
    gctx.clearRect(0, 0, gcv.width, gcv.height);

    ripples.forEach(function (p) {
      p.r += 2.1;
      var k = 1 - p.r / p.max;
      if (k <= 0) { p.dead = true; return; }
      gctx.beginPath();
      gctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      gctx.strokeStyle = "rgba(255,255,255," + (p.o * k).toFixed(3) + ")";
      gctx.lineWidth = 1.2 * k + 0.4;
      gctx.stroke();
      gctx.beginPath();
      gctx.arc(p.x, p.y, p.r * 0.94, 0, Math.PI * 2);
      gctx.strokeStyle = "rgba(35,55,54," + (p.o * k * 0.55).toFixed(3) + ")";
      gctx.lineWidth = 0.8 * k + 0.3;
      gctx.stroke();
    });

    inks.forEach(function (m) {
      m.r += 4.2;
      m.o *= 0.97;
      if (m.o < 0.02) { m.dead = true; return; }
      var op = m.o;
      gctx.fillStyle = "rgba(12,26,26," + op.toFixed(3) + ")";
      gctx.beginPath();
      gctx.ellipse(m.x, m.y, m.r * 0.34, m.r * 0.40, 0, 0, Math.PI * 2);
      gctx.fill();
      gctx.fillStyle = "rgba(12,26,26," + (op * 0.52).toFixed(3) + ")";
      gctx.beginPath();
      gctx.ellipse(m.x, m.y, m.r * 0.66, m.r * 0.76, -0.4, 0, Math.PI * 2);
      gctx.fill();
      gctx.fillStyle = "rgba(12,26,26," + (op * 0.22).toFixed(3) + ")";
      gctx.beginPath();
      gctx.ellipse(m.x, m.y, m.r, m.r * 1.12, 0.3, 0, Math.PI * 2);
      gctx.fill();
      var n = 18;
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2 + rnd(0.6);
        var rr = m.r * (0.92 + rnd(0.5));
        gctx.fillStyle = "rgba(12,26,26," + (op * 0.38 * (1 - i / n)).toFixed(3) + ")";
        gctx.beginPath();
        gctx.arc(m.x + Math.cos(a) * rr, m.y + Math.sin(a) * rr * 1.12, 1 + rnd(2.2), 0, Math.PI * 2);
        gctx.fill();
      }
    });

    rings.forEach(function (w) {
      w.r += 13;
      w.o *= 0.93;
      if (w.o < 0.02) { w.dead = true; return; }
      gctx.beginPath();
      gctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
      gctx.strokeStyle = "rgba(248,241,224," + (w.o * 0.9).toFixed(3) + ")";
      gctx.lineWidth = 3 * (w.o / 0.9) + 0.5;
      gctx.stroke();
    });

    ripples = ripples.filter(function (p) { return !p.dead; });
    inks = inks.filter(function (m) { return !m.dead; });
    rings = rings.filter(function (w) { return !w.dead; });
    requestAnimationFrame(gateLoop);
  }
  gateLoop();

  gate.addEventListener("pointerdown", function (e) {
    if (e.button === 0) spawnInk(e.clientX, e.clientY);
  });

  var gateBtn = document.getElementById("gateBtn");
  gateBtn.addEventListener("click", function () {
    if (gate.classList.contains("opening")) return;
    var b = gateBtn.getBoundingClientRect();
    var cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    rings.push({ x: cx, y: cy, r: 8, max: Math.max(gcv.width, gcv.height) * 1.4, o: 0.85 });
    spawnInk(cx, cy);
    setTimeout(function () { rings.push({ x: cx, y: cy, r: 8, max: Math.max(gcv.width, gcv.height) * 1.4, o: 0.6 }); }, 110);
    setTimeout(function () { rings.push({ x: cx, y: cy, r: 8, max: Math.max(gcv.width, gcv.height) * 1.4, o: 0.4 }); }, 230);
    gate.classList.add("opening");
    setTimeout(function () { gate.classList.add("done"); }, 1650);
  });

  /* ---------- 时辰 ---------- */
  var SHICHEN = ["子时","丑时","寅时","卯时","辰时","巳时","午时","未时","申时","酉时","戌时","亥时"];
  function shichen(h) { return SHICHEN[Math.floor(((h + 1) % 24) / 2)]; }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function tickClock() {
    var d = new Date();
    var h = d.getHours();
    document.getElementById("navClock").textContent =
      shichen(h) + " " + pad(h) + ":" + pad(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock, 30000);

  /* ---------- 诗签 ---------- */
  var VERSES = [
    "文章本天成，妙手偶得之。——陆游",
    "两句三年得，一吟双泪流。——贾岛",
    "清水出芙蓉，天然去雕饰。——李白",
    "笔落惊风雨，诗成泣鬼神。——杜甫",
    "我手写我心，我笔即我情。",
    "纸上得来终觉浅，绝知此事要躬行。——陆游",
    "言为心声，墨为心迹。",
    "粗缯大布裹生涯，腹有诗书气自华。——苏轼"
  ];
  document.getElementById("verseText").textContent =
    VERSES[Math.floor(Math.random() * VERSES.length)];

  /* ---------- 存储 ---------- */
  var KEY = "jdc.writings";
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function persist(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); return true; }
    catch (e) { toast("墨池已满，先删去几篇旧稿再存"); return false; }
  }

  /* ---------- 组件 ---------- */
  var listEl = document.getElementById("list");
  var listCountEl = document.getElementById("listCount");
  var titleEl = document.getElementById("title");
  var kindEl = document.getElementById("kind");
  var bodyEl = document.getElementById("body");
  var countEl = document.getElementById("count");
  var modeHint = document.getElementById("modeHint");
  var editingId = null;
  var SAVE_WORDS = ["墨迹已收，来日可读", "笔落成章，已入藏稿", "此稿已收，静待重读", "落墨为凭，存档于心"];
  var DEL_WORDS = ["已焚此稿", "弃稿不存", "一笔勾销"];

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function charCount(s) {
    return String(s || "").replace(/\s/g, "").length;
  }

  function stamp(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) +
      " " + shichen(d.getHours()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- 盖印 ---------- */
  function sealStamp() {
    var seal = document.getElementById("seal");
    seal.classList.remove("show");
    void seal.offsetWidth;
    seal.classList.add("show");
    setTimeout(function () { seal.classList.remove("show"); }, 1300);
  }

  /* ---------- 渲染存档 ---------- */
  function render() {
    var items = load().sort(function (a, b) { return b.ts - a.ts; });
    listCountEl.textContent = items.length + " 篇";

    var totalChars = 0, thisWeek = 0, weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    items.forEach(function (x) {
      totalChars += charCount(x.body);
      if (x.ts >= weekAgo) thisWeek += 1;
    });
    document.getElementById("statsLine").textContent =
      "共 " + items.length + " 篇 · " + totalChars.toLocaleString() + " 字 · 近七日新得 " + thisWeek + " 篇";

    listEl.textContent = "";
    if (!items.length) {
      var box = document.createElement("div");
      box.className = "empty";
      var strong = document.createElement("strong");
      strong.textContent = "藏稿尚空";
      var p = document.createElement("p");
      p.textContent = "研墨写下第一句，收墨之后，此处即添一页。";
      box.appendChild(strong); box.appendChild(p);
      listEl.appendChild(box);
      return;
    }

    items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "entry";

      var main = document.createElement("div");
      main.className = "entry-main";

      var open = document.createElement("button");
      open.type = "button";
      open.className = "entry-open";
      open.textContent = item.title || "无题";
      open.addEventListener("click", function () { read(item); });

      var meta = document.createElement("div");
      meta.className = "entry-meta";
      meta.textContent = stamp(item.ts) + " · " + (item.kind || "日记") + " · " + charCount(item.body) + " 字";

      main.appendChild(open); main.appendChild(meta);

      var actions = document.createElement("div");
      actions.className = "entry-actions";

      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "mini-btn";
      editBtn.textContent = "续笔";
      editBtn.addEventListener("click", function () { edit(item.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "mini-btn";
      del.textContent = "焚稿";
      del.addEventListener("click", function () { remove(item.id, item.title); });

      actions.appendChild(editBtn); actions.appendChild(del);
      row.appendChild(main); row.appendChild(actions);
      listEl.appendChild(row);
    });
  }

  /* ---------- 展卷阅读 ---------- */
  function read(item) {
    var reader = document.getElementById("reader");
    document.getElementById("readerTitle").textContent = item.title || "无题";
    document.getElementById("readerMeta").textContent =
      stamp(item.ts) + " · " + (item.kind || "日记");
    document.getElementById("readerBody").textContent = item.body || "";
    reader.classList.add("show");
    document.body.style.overflow = "hidden";
    setTimeout(function () {
      var b = document.getElementById("readerBody");
      b.scrollTop = 0; b.scrollLeft = b.scrollWidth;
    }, 20);
  }
  function closeReader() {
    var reader = document.getElementById("reader");
    reader.classList.remove("show");
    document.body.style.overflow = "";
  }
  document.getElementById("readerVeil").addEventListener("click", closeReader);
  document.getElementById("readerClose").addEventListener("click", closeReader);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeReader();
  });

  /* ---------- 编辑 / 删除 ---------- */
  function edit(id) {
    var item = load().filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    editingId = item.id;
    titleEl.value = item.title || "";
    kindEl.value = item.kind || "日记";
    bodyEl.value = item.body || "";
    countEl.textContent = charCount(bodyEl.value);
    modeHint.textContent = "续写 · " + stamp(item.ts);
    document.getElementById("save").textContent = "改讫";
    titleEl.scrollIntoView({ block: "start", behavior: "smooth" });
    toast("已调出旧稿");
  }

  function remove(id, title) {
    if (!window.confirm("欲焚此稿《" + (title || "无题") + "》，焚后不复可得，确乎？")) return;
    var items = load().filter(function (x) { return x.id !== id; });
    if (!persist(items)) return;
    if (editingId === id) resetForm();
    render();
    toast(DEL_WORDS[Math.floor(Math.random() * DEL_WORDS.length)]);
  }

  function resetForm() {
    editingId = null;
    titleEl.value = "";
    bodyEl.value = "";
    countEl.textContent = "0";
    modeHint.textContent = "新起一篇";
    document.getElementById("save").textContent = "收墨";
  }

  function save() {
    var body = bodyEl.value;
    if (!body.trim() && !titleEl.value.trim()) {
      toast("纸犹空白，未可收墨");
      return;
    }
    var title = titleEl.value.trim();
    if (!title) {
      var firstLine = body.split("\n").filter(function (l) { return l.trim(); })[0] || "";
      title = firstLine.trim().slice(0, 18) || "无题";
    }

    var items = load();
    var now = Date.now();
    if (editingId) {
      var hit = false;
      items = items.map(function (x) {
        if (x.id !== editingId) return x;
        hit = true;
        return { id: x.id, title: title, kind: kindEl.value, body: body, ts: now, created: x.created || x.ts };
      });
      if (!hit) items.push({ id: String(now), title: title, kind: kindEl.value, body: body, ts: now, created: now });
    } else {
      items.push({ id: String(now), title: title, kind: kindEl.value, body: body, ts: now, created: now });
    }

    if (!persist(items)) return;
    render();
    resetForm();
    sealStamp();
    toast(SAVE_WORDS[Math.floor(Math.random() * SAVE_WORDS.length)]);
  }

  bodyEl.addEventListener("input", function () {
    countEl.textContent = charCount(bodyEl.value);
  });

  document.getElementById("save").addEventListener("click", save);
  document.getElementById("reset").addEventListener("click", function () {
    if (bodyEl.value.trim() && !window.confirm("弃去当前笔墨？未收的会散失。")) return;
    resetForm();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
  });

  /* ---------- 落花 ---------- */
  var petals = [];
  var petalRunning = true;
  var cv = document.getElementById("petalCanvas");
  var ctx = cv.getContext("2d");
  var COLORS = ["rgba(166,61,47,", "rgba(196,120,60,", "rgba(160,140,90,"];
  function sizeCanvas() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }
  sizeCanvas();
  window.addEventListener("resize", sizeCanvas);

  function makePetal(init) {
    return {
      x: Math.random() * cv.width,
      y: init ? Math.random() * cv.height : -24,
      r: 2.5 + Math.random() * 3.5,
      vy: 0.35 + Math.random() * 0.75,
      vx: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.04,
      c: COLORS[Math.floor(Math.random() * COLORS.length)] + (0.28 + Math.random() * 0.22) + ")"
    };
  }
  for (var i = 0; i < 16; i++) petals.push(makePetal(true));

  function petalLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    petals.forEach(function (p, idx) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.vx += (Math.random() - 0.5) * 0.02;
      if (p.y > cv.height + 30) { petals[idx] = makePetal(false); return; }
      if (p.x < -30) p.x = cv.width + 20;
      if (p.x > cv.width + 30) p.x = -20;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * 1.25, p.r * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    if (petalRunning) requestAnimationFrame(petalLoop);
  }
  petalLoop();

  document.getElementById("bloomToggle").addEventListener("click", function () {
    petalRunning = !petalRunning;
    if (petalRunning) { petalLoop(); this.textContent = "花"; toast("落花又起"); }
    else { ctx.clearRect(0, 0, cv.width, cv.height); this.textContent = "静"; toast("花落已歇"); }
  });

  render();
})();
</script>
