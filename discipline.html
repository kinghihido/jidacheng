</head>
<body>

<main class="page">
  <p class="crumb"><a href="index.html">总台</a><span>/</span><span>日常打卡</span></p>
  <h1 class="page-title">日常打卡</h1>
  <p class="page-desc">三餐、睡眠、运动、任务。记录是为了看见节奏，不是为了责备自己。</p>
  <div class="work">
    <section class="work-cell">
      <div class="cell-head">
        <h2 class="cell-title">今天</h2>
        <span class="hint" id="todayLabel">—</span>
      </div>
      <div class="section-label">三餐</div>
      <div id="mealCheckins"></div>
      <div class="section-label">健身 · 臂力棒</div>
      <div id="fitnessCheckin"></div>
      <div class="section-label">睡眠</div>
      <div id="sleepCheckin"></div>
    </section>
    <section class="work-cell cell-flex">
      <div class="cell-head">
        <h2 class="cell-title">近况</h2>
        <span class="hint">近七天</span>
      </div>
      <div class="summary-grid">
        <div class="summary-cell">
          <div class="lit-num" id="mealPct">0<small style="font-size:13px;font-family:var(--sans);color:var(--ink-3)">%</small></div>
          <div class="lit-k">本周三餐</div>
        </div>
        <div class="summary-cell">
          <div class="lit-num" id="fitnessAvg">0</div>
          <div class="lit-k">日均臂力棒</div>
        </div>
        <div class="summary-cell">
          <div class="lit-num" id="taskDone">0</div>
          <div class="lit-k">任务完成</div>
        </div>
        <div class="summary-cell">
          <div class="lit-num" id="taskPending">0</div>
          <div class="lit-k">任务待办</div>
        </div>
      </div>
      <p class="hint" style="margin:auto 0 0;padding-top:16px">连着断一天不算前功尽弃，第二天接上就行。</p>
    </section>
    <section class="work-cell" style="grid-column:1 / -1">
      <div class="cell-head">
        <h2 class="cell-title">任务清单</h2>
        <span class="hint">按截止日期排序</span>
      </div>
      <div class="slot" style="margin-bottom:18px">
        <p style="font-family:var(--serif);font-size:18px;color:var(--ink-2);margin:0 0 12px">添加新任务</p>
        <div class="form-row">
          <div class="field">
            <label for="taskTitle">任务名称</label>
            <input type="text" id="taskTitle" placeholder="例：材料科学基础大作业">
          </div>
          <div class="field">
            <label for="taskDeadline">截止日期</label>
            <input type="date" id="taskDeadline">
          </div>
        </div>
        <div class="field">
          <label for="taskDesc">描述（可选）</label>
          <textarea id="taskDesc" rows="2" placeholder="具体要求、注意事项..."></textarea>
        </div>
        <button class="btn" id="addTaskBtn">添加任务</button>
      </div>
      <div id="taskList"></div>
    </section>
  </div>
  <p class="hint" style="margin-top:18px">打卡记录存在这台电脑的浏览器里，换设备不同步。</p>
</main>
<footer class="foot">
  <p>静态站点 · GitHub Pages · 内容只保存在本机浏览器</p>
  <p>kinghihido · 2026</p>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";
  try { localStorage.setItem("__jdc_probe","1"); localStorage.removeItem("__jdc_probe"); }
  catch (err) {
    var warn = document.createElement("p"); warn.className = "notice";
    warn.innerHTML = "<strong>存不下打卡。</strong>现在是直接打开本地文件，浏览器多数会禁掉网页存储。换成发布后的网址访问，记录才会留下。";
    document.querySelector("main").insertBefore(warn, document.querySelector("main").firstChild);
  }
  var MEAL_KEY = "jdc.meals", FITNESS_KEY = "jdc.fitness", TASKS_KEY = "jdc.tasks";
  var MEALS = ["早餐", "午餐", "晚餐"], GOAL = 50;
  var WEEK = ["日","一","二","三","四","五","六"];
  function pad(n){return n<10?"0"+n:String(n)}
  function dayKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("show")},1800)}
  function readObj(key){try{var v=JSON.parse(localStorage.getItem(key)||"{}");return v&&typeof v==="object"&&!Array.isArray(v)?v:{}}catch(e){return{}}}
  function readArr(key){try{var v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
  function write(key,data){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){toast("保存失败");return false}}

  var today = dayKey(new Date());
  document.getElementById("todayLabel").textContent =
    (new Date().getMonth()+1)+" 月 "+new Date().getDate()+" 日 · 星期"+WEEK[new Date().getDay()];

  /* 三餐 */
  var mealState = readObj(MEAL_KEY);
  if (!mealState[today]) mealState[today] = {};
  var mealBox = document.getElementById("mealCheckins");
  MEALS.forEach(function(name){
    var row=document.createElement("div");row.className="checkin-row";
    var label=document.createElement("span");label.className="checkin-label";label.textContent=name;
    var controls=document.createElement("div");controls.className="checkin-controls";
    var timeSpan=document.createElement("span");timeSpan.className="checkin-time";
    var rec=mealState[today][name];timeSpan.textContent=rec?rec.time:"--:--";
    var btn=document.createElement("button");btn.className="checkin-btn"+(rec?" done":"");btn.textContent=rec?"已打卡":"打卡";
    btn.addEventListener("click",function(){
      if(mealState[today][name]){delete mealState[today][name];btn.textContent="打卡";btn.classList.remove("done");timeSpan.textContent="--:--"}
      else{var now=new Date();mealState[today][name]={time:pad(now.getHours())+":"+pad(now.getMinutes())};btn.textContent="已打卡";btn.classList.add("done");timeSpan.textContent=mealState[today][name].time;toast(name+" 打卡成功")}
      write(MEAL_KEY,mealState);updateStats();
    });
    controls.appendChild(timeSpan);controls.appendChild(btn);row.appendChild(label);row.appendChild(controls);mealBox.appendChild(row);
  });

  /* 健身 */
  var fitState = readObj(FITNESS_KEY);
  if (!fitState[today]) fitState[today] = {count:0};
  var fitBox = document.getElementById("fitnessCheckin");fitBox.innerHTML="";
  var display=document.createElement("div");display.className="counter-display";
  var num=document.createElement("span");num.className="counter-num";
  function refreshNum(){num.innerHTML=fitState[today].count+'<small>/ '+GOAL+'</small>'}
  refreshNum();
  var track=document.createElement("div");track.className="progress-track";
  var fill=document.createElement("div");fill.className="progress-fill";
  function refreshBar(){var p=Math.min(100,Math.round((fitState[today].count/GOAL)*100));fill.style.width=p+"%";fill.className="progress-fill"+(p>=100?" complete":"")}
  track.appendChild(fill);refreshBar();
  var ctrls=document.createElement("div");ctrls.className="counter-controls";
  var minusBtn=document.createElement("button");minusBtn.className="counter-btn";minusBtn.textContent="-";
  minusBtn.addEventListener("click",function(){if(fitState[today].count>0){fitState[today].count--;refreshNum();refreshBar();input.value=fitState[today].count;doneBtn.textContent=fitState[today].count>=GOAL?"已完成":"完成 "+GOAL+" 个";write(FITNESS_KEY,fitState);updateStats()}});
  var input=document.createElement("input");input.type="number";input.className="counter-input";input.min="0";input.value=fitState[today].count;
  input.addEventListener("change",function(){var v=parseInt(input.value)||0;if(v<0)v=0;fitState[today].count=v;refreshNum();refreshBar();doneBtn.textContent=v>=GOAL?"已完成":"完成 "+GOAL+" 个";write(FITNESS_KEY,fitState);updateStats()});
  var plusBtn=document.createElement("button");plusBtn.className="counter-btn";plusBtn.textContent="+";
  plusBtn.addEventListener("click",function(){fitState[today].count++;refreshNum();refreshBar();input.value=fitState[today].count;doneBtn.textContent=fitState[today].count>=GOAL?"已完成":"完成 "+GOAL+" 个";write(FITNESS_KEY,fitState);updateStats()});
  var doneBtn=document.createElement("button");doneBtn.className="counter-btn primary";doneBtn.textContent=fitState[today].count>=GOAL?"已完成":"完成 "+GOAL+" 个";
  doneBtn.addEventListener("click",function(){fitState[today].count=GOAL;refreshNum();refreshBar();input.value=GOAL;doneBtn.textContent="已完成";write(FITNESS_KEY,fitState);toast("臂力棒 "+GOAL+" 个，完成！");updateStats()});
  ctrls.appendChild(minusBtn);ctrls.appendChild(input);ctrls.appendChild(plusBtn);ctrls.appendChild(doneBtn);
  display.appendChild(num);fitBox.appendChild(display);fitBox.appendChild(track);fitBox.appendChild(ctrls);

  /* 睡眠 */
  var sleepState = readObj(MEAL_KEY);
  if (!sleepState[today]) sleepState[today] = {};
  var sleepBox = document.getElementById("sleepCheckin");
  var sleepRow=document.createElement("div");sleepRow.className="checkin-row";
  var sleepLabel=document.createElement("span");sleepLabel.className="checkin-label";sleepLabel.textContent="入睡时间";
  var sleepControls=document.createElement("div");sleepControls.className="checkin-controls";
  var sleepTime=document.createElement("span");sleepTime.className="checkin-time";
  var sleepRec=sleepState[today]["睡眠"];sleepTime.textContent=sleepRec?sleepRec.time:"--:--";
  var sleepBtn=document.createElement("button");sleepBtn.className="checkin-btn"+(sleepRec?" done":"");sleepBtn.textContent=sleepRec?"已打卡":"打卡";
  sleepBtn.addEventListener("click",function(){
    if(sleepState[today]["睡眠"]){delete sleepState[today]["睡眠"];sleepBtn.textContent="打卡";sleepBtn.classList.remove("done");sleepTime.textContent="--:--"}
    else{var now=new Date();sleepState[today]["睡眠"]={time:pad(now.getHours())+":"+pad(now.getMinutes())};sleepBtn.textContent="已打卡";sleepBtn.classList.add("done");sleepTime.textContent=sleepState[today]["睡眠"].time;toast("睡眠打卡成功")}
    write(MEAL_KEY,sleepState);updateStats();
  });
  sleepControls.appendChild(sleepTime);sleepControls.appendChild(sleepBtn);sleepRow.appendChild(sleepLabel);sleepRow.appendChild(sleepControls);sleepBox.appendChild(sleepRow);

  /* 任务清单 */
  var tasks = readArr(TASKS_KEY);
  var taskList=document.getElementById("taskList");
  var titleInput=document.getElementById("taskTitle");
  var deadlineInput=document.getElementById("taskDeadline");
  var descInput=document.getElementById("taskDesc");
  var addBtn=document.getElementById("addTaskBtn");
  addBtn.addEventListener("click",function(){
    var title=titleInput.value.trim(),deadline=deadlineInput.value,desc=descInput.value.trim();
    if(!title){toast("请输入任务名称");return}
    if(!deadline){toast("请选择截止日期");return}
    tasks.push({id:Date.now(),title:title,deadline:deadline,desc:desc,done:false,createdAt:Date.now()});
    write(TASKS_KEY,tasks);titleInput.value="";deadlineInput.value="";descInput.value="";renderTasks();updateStats();toast("任务已添加");
  });
  function renderTasks(){
    taskList.innerHTML="";
    if(tasks.length===0){var empty=document.createElement("div");empty.className="empty-state";empty.innerHTML="<strong>还没有任务</strong>添加一个大作业，开始管理截止日期";taskList.appendChild(empty);return}
    var sorted=tasks.slice().sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;return new Date(a.deadline)-new Date(b.deadline)});
    var now=new Date();now.setHours(0,0,0,0);
    sorted.forEach(function(task){
      var card=document.createElement("div");
      var deadline=new Date(task.deadline);deadline.setHours(0,0,0,0);
      var daysLeft=Math.ceil((deadline-now)/(1000*60*60*24));
      if(!task.done&&daysLeft<0)card.className="task-card overdue";
      else if(!task.done&&daysLeft<=3)card.className="task-card urgent";
      else card.className="task-card";
      var head=document.createElement("div");head.className="task-head";
      var title=document.createElement("h3");title.className="task-title"+(task.done?" done":"");title.textContent=task.title;
      var actions=document.createElement("div");actions.className="task-actions";
      var toggleBtn=document.createElement("button");toggleBtn.textContent=task.done?"↩ 撤销":"✓ 完成";
      toggleBtn.addEventListener("click",function(){task.done=!task.done;write(TASKS_KEY,tasks);renderTasks();updateStats();toast(task.done?"任务已完成":"任务已恢复")});
      var delBtn=document.createElement("button");delBtn.textContent="✕ 删除";
      delBtn.addEventListener("click",function(){if(confirm("确定删除？")){tasks=tasks.filter(function(t){return t.id!==task.id});write(TASKS_KEY,tasks);renderTasks();updateStats();toast("任务已删除")}});
      actions.appendChild(toggleBtn);actions.appendChild(delBtn);head.appendChild(title);head.appendChild(actions);
      var meta=document.createElement("div");meta.className="task-meta";
      var dlSpan=document.createElement("span");var dlDate=new Date(task.deadline);dlSpan.textContent="截止 "+dlDate.getFullYear()+"."+pad(dlDate.getMonth()+1)+"."+pad(dlDate.getDate());
      var stSpan=document.createElement("span");
      if(task.done){stSpan.textContent="已完成";stSpan.style.color="var(--accent)"}
      else if(daysLeft<0){stSpan.textContent="已逾期 "+Math.abs(daysLeft)+" 天";stSpan.className="overdue"}
      else if(daysLeft===0){stSpan.textContent="今天截止";stSpan.className="urgent"}
      else if(daysLeft<=3){stSpan.textContent="还剩 "+daysLeft+" 天";stSpan.className="urgent"}
      else{stSpan.textContent="还剩 "+daysLeft+" 天"}
      meta.appendChild(dlSpan);meta.appendChild(stSpan);card.appendChild(head);card.appendChild(meta);
      if(task.desc){var desc=document.createElement("div");desc.className="task-desc";desc.textContent=task.desc;card.appendChild(desc)}
      taskList.appendChild(card);
    });
  }
  renderTasks();

  /* 统计 */
  function updateStats(){
    var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(dayKey(d))}
    var mealTotal=0,mealPossible=days.length*MEALS.length;
    days.forEach(function(dk){var rec=mealState[dk]||{};MEALS.forEach(function(m){if(rec[m])mealTotal++})});
    document.getElementById("mealPct").innerHTML=Math.round((mealTotal/mealPossible)*100)+'<small style="font-size:13px;font-family:var(--sans);color:var(--ink-3)">%</small>';
    var fitTotal=0;days.forEach(function(dk){var rec=fitState[dk];if(rec)fitTotal+=(rec.count||0)});
    document.getElementById("fitnessAvg").textContent=Math.round(fitTotal/days.length);
    var doneCount=0,pendingCount=0;tasks.forEach(function(t){if(t.done)doneCount++;else pendingCount++});
    document.getElementById("taskDone").textContent=doneCount;
    document.getElementById("taskPending").textContent=pendingCount;
  }
  updateStats();
  (function clock(){var d=new Date();document.getElementById("navClock").textContent=pad(d.getHours())+":"+pad(d.getMinutes())})();
})();
</script>
</body>
