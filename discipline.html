<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2324544a'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23edeEE9' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topbar">
  <a class="brand" href="index.html">集大成者</a>
  <ul class="nav">
    <li><a href="index.html">总台</a></li>
    <li><a href="writing.html">创作</a></li>
    <li><a href="photography.html">摄影</a></li>
    <li><a href="study.html">本科学习</a></li>

    <li><a href="discipline.html" aria-current="page">日常</a></li>
  </ul>
  <span class="topbar-clock" id="navClock">--:--</span>
</nav>

<main class="page">
  <p class="crumb"><a href="index.html">总台</a><span>/</span><span>日常网站</span></p>
  <h1 class="page-title">日常网站</h1>
  <p class="page-desc">五件事：早起、运动、阅读、专注、早睡。打勾是为了看见节奏，不是为了给自己记账。</p>

  <div class="work">
    <!-- 今日 -->
    <section class="work-cell">
      <div class="cell-head">
        <h2 class="cell-title">今天</h2>
        <span class="hint" id="todayLabel">—</span>
      </div>
      <div id="toggles"></div>
    </section>

    <!-- 数字 -->
    <section class="work-cell cell-flex">
      <div class="cell-head">
        <h2 class="cell-title">近况</h2>
        <span class="hint">近七天</span>
      </div>
      <div class="summary-grid">
        <div class="summary-cell">
          <div class="lit-num" id="weekPct">0<small style="font-size:13px;font-family:var(--sans);color:var(--ink-3)">%</small></div>
          <div class="lit-k">本周完成度</div>
        </div>
        <div class="summary-cell">
          <div class="lit-num" id="streak">0</div>
          <div class="lit-k">连续打卡 · 天</div>
        </div>
        <div class="summary-cell">
          <div class="lit-num" id="todayDone">0</div>
          <div class="lit-k">今天完成 · 项</div>
        </div>
        <div class="summary-cell">
          <div class="lit-num" id="weekCount">0</div>
          <div class="lit-k">本周打卡 · 次</div>
        </div>
      </div>
      <p class="hint" style="margin:auto 0 0;padding-top:16px">连着断一天不算前功尽弃，第二天接上就行。</p>
    </section>

    <!-- 七天表 -->
    <section class="work-cell" style="grid-column:1 / -1">
      <div class="cell-head">
        <h2 class="cell-title">这七天</h2>
        <span class="hint">实心为已做</span>
      </div>
      <div class="table-wrap">
        <table class="habit-table" id="weekTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <p class="hint" style="margin-top:18px">打卡记录存在这台电脑的浏览器里，换设备不同步。</p>
</main>

<footer class="foot">
  <p>静态站点 · GitHub Pages · 内容只保存在本机浏览器</p>
  <p>kinghihido · 2026</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  try {
    localStorage.setItem("__jdc_probe", "1");
    localStorage.removeItem("__jdc_probe");
  } catch (err) {
    var warn = document.createElement("p");
    warn.className = "notice";
    warn.innerHTML = "<strong>存不下打卡。</strong>现在是直接打开本地文件，浏览器多数会禁掉网页存储。换成发布后的网址访问，记录才会留下。";
    var host = document.querySelector("main");
    host.insertBefore(warn, host.firstChild);
  }

  var KEY = "jdc.habits";
  var HABITS = ["早起", "运动", "阅读", "专注", "早睡"];
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function dayKey(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 1800);
  }

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || "{}");
      return v && typeof v === "object" && !Array.isArray(v) ? v : {};
    } catch (e) {
      return {};
    }
  }

  function persist(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      toast("保存失败，浏览器存储可能满了");
      return false;
    }
  }

  var todayKey = dayKey(new Date());
  var state = load();
  if (!Array.isArray(state[todayKey])) state[todayKey] = state[todayKey] || [];

  var toggleBox = document.getElementById("toggles");
  HABITS.forEach(function (name) {
    var label = document.createElement("label");
    label.className = "habit-toggle";
    label.style.borderTop = "1px solid var(--rule-soft)";

    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = state[todayKey].indexOf(name) > -1;
    box.setAttribute("data-habit", name);

    var text = document.createElement("span");
    text.textContent = name;

    box.addEventListener("change", function () {
      var list = state[todayKey].slice();
      var at = list.indexOf(name);
      if (box.checked && at === -1) list.push(name);
      if (!box.checked && at > -1) list.splice(at, 1);
      state[todayKey] = list;
      if (!persist(state)) return;
      paint();
    });

    label.appendChild(box);
    label.appendChild(text);
    toggleBox.appendChild(label);
  });
  toggleBox.firstChild.style.borderTop = "none";

  function paint() {
    var rec = state[todayKey] || [];
    Array.prototype.forEach.call(toggleBox.querySelectorAll("input"), function (box) {
      box.checked = rec.indexOf(box.getAttribute("data-habit")) > -1;
    });

    var d = new Date();
    document.getElementById("todayLabel").textContent =
      (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · 星期" + WEEK[d.getDay()] + " · " + rec.length + "/" + HABITS.length;

    /* 近七天表 */
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var dd = new Date();
      dd.setDate(dd.getDate() - i);
      days.push(dd);
    }

    var thead = document.querySelector("#weekTable thead");
    var tbody = document.querySelector("#weekTable tbody");
    thead.textContent = "";
    tbody.textContent = "";

    var headRow = document.createElement("tr");
    var corner = document.createElement("th");
    corner.textContent = "习惯";
    headRow.appendChild(corner);
    days.forEach(function (day) {
      var th = document.createElement("th");
      th.textContent = (day.getMonth() + 1) + "." + day.getDate();
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);

    HABITS.forEach(function (name) {
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      th.scope = "row";
      th.textContent = name;
      tr.appendChild(th);
      days.forEach(function (day) {
        var td = document.createElement("td");
        var mark = document.createElement("span");
        var hit = (state[dayKey(day)] || []).indexOf(name) > -1;
        mark.className = "cell-mark" + (hit ? " on" : "");
        td.appendChild(mark);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    /* 本周完成度 */
    var hits = 0;
    days.forEach(function (day) { hits += (state[dayKey(day)] || []).length; });
    document.getElementById("weekPct").innerHTML = Math.round((hits / (HABITS.length * 7)) * 100) +
      '<small style="font-size:13px;font-family:var(--sans);color:var(--ink-3)">%</small>';
    document.getElementById("weekCount").textContent = hits;
    document.getElementById("todayDone").textContent = rec.length;

    /* 连续天数：今天没记就从昨天算起 */
    var streak = 0;
    var cursor = new Date();
    if ((state[dayKey(cursor)] || []).length === 0) cursor.setDate(cursor.getDate() - 1);
    while ((state[dayKey(cursor)] || []).length > 0) {
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    document.getElementById("streak").textContent = streak;
  }

  (function clock() {
    var d = new Date();
    document.getElementById("navClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  })();

  paint();
})();
</script>

</body>
</html>
