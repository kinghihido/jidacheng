<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学海无涯 · 集大成者</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2324544a'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23edeEE9' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topbar">
  <a class="brand" href="index.html">集大成者</a>
  <ul class="nav">
    <li><a href="index.html">总台</a></li>
    <li><a href="writing.html">创作</a></li>
    <li><a href="photography.html">摄影</a></li>
    <li><a href="study.html">本科学习</a></li>
    <li><a href="literature.html" aria-current="page">学海无涯</a></li>
    <li><a href="discipline.html">日常</a></li>
  </ul>
  <span class="topbar-clock" id="navClock">--:--</span>
</nav>

<main class="page">
  <p class="crumb"><a href="index.html">总台</a><span>/</span><span>学海无涯</span></p>
  <h1 class="page-title">学海无涯</h1>
  <p class="page-desc">王老师的指导文献精读笔记。每篇报告涵盖七个维度：概述、原文引用、原理总结、可借鉴之处、相关理论、通用词汇、专业词汇。</p>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div class="chips" id="filters">
      <button class="chip" type="button" data-f="全部" aria-pressed="true">全部</button>
      <button class="chip" type="button" data-f="Raman" aria-pressed="false">Raman</button>
      <button class="chip" type="button" data-f="TMD" aria-pressed="false">TMD 生长</button>
    </div>
    <div style="flex:1;min-width:140px">
      <input id="search" type="search" placeholder="按题目或作者搜" style="font-size:14px;padding:7px 10px;min-height:34px">
    </div>
    <span class="hint" id="total">共 0 篇</span>
  </div>

  <div id="paperList"></div>

  <div class="vocab-panel" id="vocabPanel" style="display:none">
    <div class="vocab-panel-head">
      <h3>词汇积累</h3>
      <span class="hint" id="vocabCount">0 条</span>
    </div>
    <div class="vocab-panel-body">
      <input id="vocabSearch" type="search" placeholder="搜词汇" style="font-size:13px;padding:6px 10px;margin-bottom:10px;min-height:32px">
      <div id="vocabList"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <p>静态站点 · GitHub Pages · 内容只保存在本机浏览器</p>
  <p>kinghihido · 2026</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var KEYS = { papers: "jdc.papers", vocab: "jdc.vocab" };
  var state = { papers: [], vocab: [], filter: "全部", query: "", vocabQuery: "" };

  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }
  function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }
  function load(key, fb) { try { var v = JSON.parse(localStorage.getItem(key) || "null"); return v === null ? fb : v; } catch (e) { return fb; } }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function getTag(p) { return p.id && p.id.indexOf("raman") === 0 ? "Raman" : (p.id && p.id.indexOf("tmd") === 0 ? "TMD" : ""); }

  function render() {
    var listEl = document.getElementById("paperList");
    var filtered = state.papers.filter(function (p) {
      var tag = getTag(p);
      var okTag = state.filter === "全部" || tag === state.filter;
      var q = state.query.toLowerCase();
      var okQ = !q || (p.title || "").toLowerCase().indexOf(q) > -1 || (p.meta || "").toLowerCase().indexOf(q) > -1;
      return okTag && okQ;
    }).sort(function (a, b) { return b.createdAt - a.createdAt; });

    document.getElementById("total").textContent = "共 " + state.papers.length + " 篇";
    listEl.textContent = "";

    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty"><strong>没有符合条件的</strong><p>换个关键词试试。</p></div>';
      renderVocab(); return;
    }

    filtered.forEach(function (paper) {
      var a = document.createElement("a");
      a.href = "report.html?id=" + encodeURIComponent(paper.id);
      a.className = "report-block";
      a.style.cssText = "display:block;text-decoration:none;color:inherit;cursor:pointer;transition:box-shadow .2s,border-color .2s";
      a.onmouseenter = function () { this.style.boxShadow = "0 2px 12px rgba(0,0,0,.08)"; this.style.borderColor = "var(--ink-3)"; };
      a.onmouseleave = function () { this.style.boxShadow = ""; this.style.borderColor = ""; };

      var tag = getTag(paper);
      var preview = (paper.summary || "").replace(/\s+/g, " ").trim();
      if (preview.length > 140) preview = preview.slice(0, 140) + "……";

      a.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
          '<div style="min-width:0;flex:1">' +
            '<h3 class="report-title" style="margin-bottom:4px">' + esc(paper.title || "无题") + '</h3>' +
            '<div class="report-meta">' + esc(paper.meta || "") + '</div>' +
            (preview ? '<p style="margin-top:8px;font-size:14px;color:var(--ink-2);line-height:1.7">' + esc(preview) + '</p>' : '') +
          '</div>' +
          '<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px">' +
            (tag ? '<span class="status-tag">' + esc(tag) + '</span>' : '') +
            '<span style="font-size:12px;color:var(--ink-3)">查看报告 &rarr;</span>' +
          '</div>' +
        '</div>';
      listEl.appendChild(a);
    });
    renderVocab();
  }

  function renderVocab() {
    var panel = document.getElementById("vocabPanel");
    var listEl = document.getElementById("vocabList");
    var countEl = document.getElementById("vocabCount");
    if (!state.vocab.length) { panel.style.display = "none"; return; }
    panel.style.display = "";
    countEl.textContent = state.vocab.length + " 条";
    var q = state.vocabQuery.toLowerCase();
    var filtered = state.vocab.filter(function (v) {
      if (!q) return true;
      return (v.term || "").toLowerCase().indexOf(q) > -1 || (v.english || "").toLowerCase().indexOf(q) > -1 || (v.definition || "").toLowerCase().indexOf(q) > -1;
    });
    listEl.textContent = "";
    if (!filtered.length) { listEl.innerHTML = '<p class="hint">没有找到匹配的词汇</p>'; return; }
    var table = document.createElement("table");
    table.className = "vocab-table";
    table.innerHTML = "<thead><tr><th>术语</th><th>English</th><th>释义</th><th>分类</th></tr></thead>";
    var tbody = document.createElement("tbody");
    filtered.forEach(function (v) {
      var tr = document.createElement("tr");
      tr.innerHTML = '<td class="vocab-term">' + esc(v.term) + '</td><td class="vocab-en">' + esc(v.english) + '</td><td>' + esc(v.definition) + '</td><td><span class="status-tag">' + esc(v.category || "") + '</span></td>';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    listEl.appendChild(table);
  }

  document.getElementById("filters").addEventListener("click", function (e) {
    var btn = e.target.closest(".chip"); if (!btn) return;
    state.filter = btn.getAttribute("data-f");
    Array.prototype.forEach.call(this.querySelectorAll(".chip"), function (c) { c.setAttribute("aria-pressed", String(c === btn)); });
    render();
  });
  document.getElementById("search").addEventListener("input", function () { state.query = this.value; render(); });
  document.getElementById("vocabSearch").addEventListener("input", function () { state.vocabQuery = this.value; renderVocab(); });

  (function () { var d = new Date(); document.getElementById("navClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()); })();

  state.papers = load(KEYS.papers, []);
  if (!Array.isArray(state.papers)) state.papers = [];
  state.vocab = load(KEYS.vocab, []);
  if (!Array.isArray(state.vocab)) state.vocab = [];

  if (state.papers.length === 0) {
    fetch("papers.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
      if (data && data.length) {
        state.papers = data; store(KEYS.papers, data);
        data.forEach(function (p) {
          [].concat(p.vocabGeneral || [], p.vocabDomain || []).forEach(function (v) {
            if (!v.category) v.category = (p.vocabGeneral || []).some(function (g) { return g.english === v.english; }) ? "通用" : "专业";
            if (!state.vocab.some(function (e) { return e.english.toLowerCase() === v.english.toLowerCase(); })) state.vocab.push(v);
          });
        });
        store(KEYS.vocab, state.vocab);
        render();
      }
    }).catch(function () {});
  }
  render();
})();
</script>
</body>
</html>
